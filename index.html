function trCancelar(j){
  if(j.transp.ts.partida){ toast('Já partiste — conclui o transporte','err'); return; }
  if(!confirm('Cancelar este transporte?\n\nNão fica nada registado.')) return;
  // _reg = 'esta sessão já está tratada': sem isto a rede de segurança dos registos
  // via uma sessão terminada sem registo e escrevia-a, contra o que aqui se promete.
  (j.workers||[]).forEach(w=>{ if(!w.endTs){ w.endTs=nowTs(); w.status='parado'; } w._reg=true; });
  j.status='done'; save(); pushTrabAberto(j,'fechado'); trApagarMedia(j.id);
  state._trErros=[]; state.view='board'; toast('Transporte cancelado','ok');
}

/* ---- validação e fases ---- */
function trErrosFase(j,fase){
  const t=j.transp; const e=[];
  if(fase==='carga'){ if(!t.caixas.length) e.push('Escolhe as caixas que vão no camião.'); }
  if(fase==='guia'){ const gn=String(t.guia.numero||'').trim(), ga=String(t.guia.codigoAT||'').trim();
    if(!gn && !ga) e.push('Escreve o nº da guia ou o código AT — a guia tem de estar feita antes de partir.');
    else if((gn && !trGuiaValida(gn)) || (ga && !trGuiaValida(ga))) e.push('O que está no campo da guia não parece um nº nem um código AT. Copia-o do painel azul do Portal.'); }
  if(fase==='descarga'){
    t.caixas.forEach((c,i)=>{ const nm=(i+1)+'. '+trNomeCx(c);
      const falta=trSlots(c).filter(s=>!(c.fotos&&c.fotos[s.k])).map(s=>s.t); if(falta.length) e.push(nm+': falta a foto '+falta.join(', '));
      if(!c.estado) e.push(nm+': marca se está sem danos ou com dano');
      else if(c.estado==='dano'){ if(!String(c.danoDesc||'').trim()) e.push(nm+': descreve o dano'); if(!(c.danos||[]).length) e.push(nm+': tira pelo menos uma foto do dano'); } });
    TR_CHECK.forEach(q=>{ if(!t.checklist[q.k]) e.push('Responde: '+q.t); });
    if(TR_CHECK.some(q=>t.checklist[q.k]==='nao') && !String(t.observacoes||'').trim()) e.push('Explica nas observações o que respondeste "Não".');
  }
  if(fase==='rececao'){ const r=t.recetor;
    if(!String(r.nome||'').trim()) e.push('Escreve o nome de quem recebe na ANN.');
    if(r.recusou){ if(!String(r.motivo||'').trim()) e.push('Escreve porque é que a ANN não assinou.'); }
    else if(!t.assinado.ann) e.push('Falta a assinatura de quem recebe na ANN.');
    if(!t.assinado.mot) e.push('Falta a assinatura do motorista.');
  }
  return e;
}
function trIrFase(j,fase){
  const t=j.transp; const er=trErrosFase(j,t.fase);
  if(er.length){ state._trErros=er; render(); window.scrollTo(0,0); return; }
  state._trErros=[]; state._trPasso=null; t.fase=fase; if(fase==='rececao') trGps(j,'rececao');
  save(); render(); window.scrollTo(0,0);
}
function trVoltar(j,fase){ j.transp.fase=fase; state._trErros=[]; state._trPasso=null; save(); render(); window.scrollTo(0,0); }
function trGps(j,qual){
  if(!navigator.geolocation) return;
  try{ navigator.geolocation.getCurrentPosition(p=>{ j.transp.gps[qual]={lat:p.coords.latitude, lon:p.coords.longitude, prec:Math.round(p.coords.accuracy), ts:nowTs()}; delete j.transp.gps[qual+'Erro']; save(); },
    err=>{ j.transp.gps[qual+'Erro']=(err&&err.code===1)?'sem autorização':'indisponível'; save(); }, {enableHighAccuracy:true, timeout:20000, maximumAge:120000}); }catch(e){}
}
function trPartir(j){
  const t=j.transp;
  const er=trErrosFase(j,'carga').concat(trErrosFase(j,'guia'));
  if(er.length){ state._trErros=er; render(); window.scrollTo(0,0); return; }
  if(!t.ts.partida){
    const agora=nowTs(); t.ts.partida=agora;
    if(!t.stockRegistado){
      const q=loadStockQ(); const dh=new Date().toLocaleString('pt-PT'); const dia=dstr(agora); const pin=(state.op&&state.op.pin)||'x'; const nome=(state.op&&state.op.nome)||(j.workers[0]||{}).op||'';
      t.caixas.forEach(c=>{
        if(c.tipo==='lote') q.push({ ID:'STQ-'+pin+'-'+agora+'-'+c.artigo.replace(/\W/g,'').slice(0,12), Data:dia, Motorista:nome, Programa:c.programa||'', Artigo:c.artigo, NumSerie:String(c.qtd), Movimento:'Sai', Destino:'ANN', DataHoraRegisto:dh });
        else q.push({ ID:'ST-'+pin+'-'+agora+'-'+c.serie, Data:dia, Motorista:nome, Programa:c.programa||'', Artigo:c.artigo, NumSerie:c.serie, Movimento:'Sai', Destino:'ANN', DataHoraRegisto:dh });
      });
      saveStockQ(q); t.stockRegistado=true; syncStockQ();
    }
  }
  state._trErros=[]; state._trPasso=null; t.fase='viagem'; save(); pushTrabAberto(j,'aberto'); window.scrollTo(0,0);
  toast('Boa viagem — a saída para a ANN ficou registada no stock','ok');
}
function trChegada(j){ const t=j.transp; if(!t.ts.chegada){ t.ts.chegada=nowTs(); trGps(j,'chegada'); } t.fase='portaria'; save(); window.scrollTo(0,0); toast('Chegada à portaria registada às '+hhmm(t.ts.chegada),'ok'); }
function trComecarDescarga(j){
  const t=j.transp;
  if(!t.ts.descarga){
    t.ts.descarga=nowTs(); trGps(j,'descarga');
    if(!t.esperaRegistada && t.ts.chegada){
      const w=trMeuWorker(j) || (j.workers||[]).find(x=>!x.endTs); const tipo=trTipoEspera();
      if(w && t.ts.descarga-t.ts.chegada>=60000){
        (w.pauses=w.pauses||[]).push({start:t.ts.chegada, end:t.ts.descarga, motivo:tipo});   // sai do tempo do trabalho
        enqueuePerturbacao(pertRecord(w.op, tipo, t.ts.chegada, t.ts.descarga));            // e fica como paragem
      }
      t.esperaRegistada=true;
    }
  }
  t.fase='descarga'; save(); window.scrollTo(0,0); toast('Descarga — fotografa cada caixa','ok');
}

/* ---- carga: escolher as caixas ---- */
function trToggleSerie(j,a,se){ const t=j.transp; const i=t.caixas.findIndex(c=>c.tipo==='caixa'&&c.artigo===a&&c.serie===se);
  if(i>=0) t.caixas.splice(i,1); else t.caixas.push(trNovaCaixa({tipo:'caixa',artigo:a,programa:progDoArtigo(a),serie:se,qtd:1,origem:'stock'}));
  save(); render(); }
function trTodasSeries(j,a,series){ series.forEach(se=>{ if(!j.transp.caixas.some(c=>c.tipo==='caixa'&&c.artigo===a&&c.serie===se)) j.transp.caixas.push(trNovaCaixa({tipo:'caixa',artigo:a,programa:progDoArtigo(a),serie:se,qtd:1,origem:'stock'})); }); save(); render(); }
function trSetLote(j,a,v,max,rerender){ const t=j.transp; let n=parseInt(String(v).replace(/[^\d]/g,''),10)||0;
  if(max!=null && n>max){ n=max; const inp=document.getElementById('trq_'+a.replace(/\W/g,'')); if(inp) inp.value=String(n); }
  const c=t.caixas.find(x=>x.tipo==='lote'&&x.artigo===a);
  if(n<=0){ if(c) t.caixas=t.caixas.filter(x=>x!==c); } else if(c) c.qtd=n; else t.caixas.push(trNovaCaixa({tipo:'lote',artigo:a,programa:progDoArtigo(a),qtd:n,origem:'stock'}));
  save(); if(rerender) render(); else { const r=document.getElementById('trResumoCarga'); if(r) r.textContent=trNCaixas(j)+' caixa(s) escolhida(s)'; } }
function trAdicionarManual(j){ const t=j.transp;
  const art=((document.getElementById('trAddArt')||{}).value||'').trim(); const txt=((document.getElementById('trAddSer')||{}).value||'').trim();
  const a=((state.cfg&&state.cfg.artigos)||[]).find(x=>trNorm(x.artigo)===trNorm(art)); if(!a){ toast('Escolhe a caixa da lista','err'); return; }
  const prog=a.programa||progDoArtigo(a.artigo);
  if(porQuantidade(prog)){ const n=parseInt(txt.replace(/[^\d]/g,''),10)||0; if(n<=0){ toast('Indica quantas caixas','err'); return; }

function trQualidade(j){ const n=(j.transp.caixas||[]).length*3; return n>45?{max:1024,q:0.55}:{max:1280,q:0.62}; }
function trProcessarFoto(j, src, sw, sh, legenda){
  const {max,q}=trQualidade(j); let w=sw, h=sh;
  if(Math.max(w,h)>max){ if(w>=h){ h=Math.round(h*max/w); w=max; } else { w=Math.round(w*max/h); h=max; } }
  const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.drawImage(src,0,0,w,h);
  const agora=new Date();
  const linhas=[two(agora.getDate())+'/'+two(agora.getMonth()+1)+'/'+agora.getFullYear()+'  '+two(agora.getHours())+':'+two(agora.getMinutes())+':'+two(agora.getSeconds())].concat(legenda);
  const fs=Math.max(14,Math.round(Math.min(w,h*1.4)*0.028)); const lh=Math.round(fs*1.3); const pad=Math.round(fs*0.6); const bh=lh*linhas.length+pad*2;
  x.fillStyle='rgba(0,0,0,0.58)'; x.fillRect(0,h-bh,w,bh); x.fillStyle='#fff'; x.font='600 '+fs+'px Arial, sans-serif'; x.textBaseline='top';
  linhas.forEach((tx,i)=>x.fillText(tx,pad,h-bh+pad+i*lh,w-pad*2));
  const full=c.toDataURL('image/jpeg',q);
  const tw=240, th=Math.round(h*tw/w); const tc=document.createElement('canvas'); tc.width=tw; tc.height=th; tc.getContext('2d').drawImage(c,0,0,tw,th);
  return { full, thumb:tc.toDataURL('image/jpeg',0.6), quando:agora.getTime() };
}

function trAbrirCamara(o){

    catch(e){ fechar(); toast('Câmara indisponível — a abrir a câmara do tablet','err'); trFotoDeFicheiro(o); } })();

function trMontarAssinaturas(j){
  [['trSigAnn','ann'],['trSigMot','mot']].forEach(([id,key])=>{
    const cv=document.getElementById(id); if(!cv||cv._montado) return; cv._montado=true;
    const dpr=Math.min(window.devicePixelRatio||1,2); const w=cv.clientWidth||300; cv.width=Math.round(w*dpr); cv.height=Math.round(170*dpr);
    const ctx=cv.getContext('2d'); const prep=()=>{ ctx.lineWidth=2.6*dpr; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#10243e'; };
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); prep();
    const k=j.id+'|sig|'+key; if(_trSig[k]){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,cv.width,cv.height); img.src=_trSig[k]; }
    let des=false, traco=0, ult=null;
    const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*(cv.width/r.width), y:(e.clientY-r.top)*(cv.height/r.height)}; };
    cv.addEventListener('pointerdown',e=>{ e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(x){} des=true; traco=0; prep(); ult=pos(e); ctx.beginPath(); ctx.moveTo(ult.x,ult.y); });
    cv.addEventListener('pointermove',e=>{ if(!des) return; e.preventDefault(); const p=pos(e); traco+=Math.hypot(p.x-ult.x,p.y-ult.y); ult=p; ctx.lineTo(p.x,p.y); ctx.stroke(); });
    const fim=()=>{ if(!des) return; des=false; if(traco>8){ const url=cv.toDataURL('image/png'); _trSig[k]=url; j.transp.assinado[key]=true; save();
      trPut('mini',{k, sig:url, ts:Date.now()}).catch(()=>{}); const st=document.getElementById(key==='ann'?'trStAnn':'trStMot'); if(st) st.textContent='✓ assinado'; } };

/* ---- dados para a guia, prontos a copiar ----
   15-09-2026: a Sónia testou a guia no Portal e "a pior coisa é preencher os campos, demora muito".
   O Portal não deixa copiar uma guia anterior nem ser preenchido por outra app, por isso o quiosque

   Copiar em cada campo. Os dados fixos vêm do config.json → entregasANN.guia (ela pode corrigir lá);
   estes são a reserva, tirados das Listas de Verificação e da app de Expedições. */
const TR_GUIA_PADRAO = { unidade:'UN', prefixoDescricao:'Caixa de embalagem',
  carga:{ nome:'Embaresa PT, Lda', morada:'Rua do Azeite, n.º 7', codigoPostal:'7005-422', localidade:'Évora' },
  destinatarios:[
    { id:'met',  curto:'ANN Metálicas (Lote A2)', nome:'ANN Évora Estruturas Metálicas, S.A.',   nif:'508622727', morada:'Lote A2, Parque de Indústria Aeronáutica de Évora, S/N', codigoPostal:'7005-797', localidade:'Évora' },
    { id:'comp', curto:'ANN Compósitos (Lote B)', nome:'ANN Évora Estruturas em Compósitos, S.A.', nif:'508622732', morada:'Lote B, Parque de Indústria Aeronáutica de Évora, S/N',  codigoPostal:'7005-797', localidade:'Évora' } ] };
function trGuiaCfg(){ const g=(state.cfg&&state.cfg.entregasANN&&state.cfg.entregasANN.guia)||{};
  return { unidade:g.unidade||TR_GUIA_PADRAO.unidade, prefixoDescricao:(g.prefixoDescricao!=null?g.prefixoDescricao:TR_GUIA_PADRAO.prefixoDescricao),
    carga:g.carga||TR_GUIA_PADRAO.carga, viatura:g.viatura||'', destinatarios:(g.destinatarios&&g.destinatarios.length)?g.destinatarios:TR_GUIA_PADRAO.destinatarios }; }
function trDestinatario(t){ const ds=trGuiaCfg().destinatarios; let id=t.guia.dest; if(!id){ try{ id=localStorage.getItem('q_tr_dest')||''; }catch(e){} } return ds.find(d=>d.id===id)||ds[0]; }
function trBens(j){ const g=trGuiaCfg(); const por={};
  j.transp.caixas.forEach(c=>{ const b=(por[c.artigo]=por[c.artigo]||{artigo:c.artigo,qtd:0,series:[]}); b.qtd+=(c.tipo==='lote'?(c.qtd||0):1); if(c.tipo!=='lote'&&c.serie) b.series.push(c.serie); });
  // "Caixa de embalagem Caixa para Ailerons" lia-se mal: nas caixas cujo nome já diz o que são, sem prefixo
  const linhas = Object.values(por).map(b=>{ const pre=(g.prefixoDescricao && !/^(caixa|cxs?)\b/i.test(b.artigo)) ? g.prefixoDescricao+' ' : '';
    return { descricao:(pre+b.artigo+(b.series.length?(' — séries '+b.series.join(', ')):'')).slice(0,200), qtd:b.qtd, unidade:g.unidade }; });
  // 16-09-2026: cada linha de bens são 3 campos a preencher no Portal. Com 3 tipos de caixa eram
  // 9 campos só para os bens. Numa linha só, com tudo descrito e a quantidade total, são 3.
  if(!trBensUmaLinha() || linhas.length<=1) return linhas;
  const tudo = Object.values(por);
  const total = tudo.reduce((s,b)=>s+b.qtd,0);
  const desc = 'Caixas de embalagem: '+tudo.map(b=>b.artigo+' ('+b.qtd+')'+(b.series.length?(' séries '+b.series.join(',')):'')).join('; ');
  if(desc.length>200) return linhas;   // não caberia numa descrição: melhor uma linha por caixa do que texto cortado
  return [{ descricao:desc, qtd:total, unidade:g.unidade }];
}

async function trCopiar(txt, botao){
  let ok=false;
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(String(txt)); ok=true; } }catch(e){}
  if(!ok){ try{ const ta=document.createElement('textarea'); ta.value=String(txt); ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,ta.value.length); ok=document.execCommand('copy'); ta.remove(); }catch(e){ ok=false; } }
  if(botao){ botao.textContent=ok?'✓ Copiado':'Não copiou'; botao.classList.toggle('ok',ok); setTimeout(()=>{ if(botao.isConnected){ botao.textContent='Copiar'; botao.classList.remove('ok'); } },1800); }
  window.__trUltimaCopia=ok?String(txt):null;
  return ok;
}

// O quiosque não consegue ler a guia dentro do Portal (é outro site, com login das Finanças).
// O mais perto disso: copiar no Portal e "Colar" aqui com um toque. Se o texto copiado trouxer os
// rótulos (ex.: "Código AT: 123…", "N.º documento: GT…"), separa-se sozinho nos dois campos.
function trExtrairGuia(txt){
  const s=String(txt||''); const r={};
  const at=s.match(/c[óo]digo(?:\s+de\s+identifica[çc][ãa]o)?(?:\s+(?:AT|do\s+documento))?\s*[:\-–]?\s*([A-Z0-9][A-Z0-9-]{5,})/i); if(at) r.codigoAT=at[1];
  const nr=s.match(/(?:n\.?\s*[ºo°]\s*(?:do\s+)?(?:documento|guia)?|n[úu]mero(?:\s+do\s+documento)?)\s*[:\-–]?\s*([A-Z0-9][A-Z0-9 .\/\-]{1,30}[A-Z0-9])/i); if(nr) r.numero=nr[1].trim();
  return r;
}
// Um numero de guia e curto: "GT ATDT202601GT/432" ou um ATCUD "J6ZK3XS9-432". Tudo o que
// venha com chavetas, aspas ou tamanho de texto nao e numero nenhum - e quase sempre o
// payload dos dados, que ja esteve na area de transferencia.
function trLimpaGuia(v){ return String(v||'').replace(/[\r\n]+/g,' ').trim().slice(0,40); }
function trGuiaValida(v){ v=trLimpaGuia(v); if(!v) return false;
  if(/[\{\}\[\]"]/.test(v)) return false;        // JSON, de certeza que nao
  if(v.length>40) return false;

async function trColar(j, campo){

/* ---- favorito que preenche a guia no Portal ----

   guias nem aceita ficheiro de quem não tem programa certificado, e não se pode preencher de
   fora. O que dá: um FAVORITO (bookmarklet) guardado no browser. O quiosque põe os dados desta
   entrega na área de transferência e o favorito, na página da guia, preenche os campos todos.
   Preenche — nunca submete. Os nomes dos campos vieram da própria página do Portal
   (guia portal.html em 3-Documentacao) e do emitirDocTranspForm.js. */
function trPayloadGuia(j){
  const t=j.transp, g=trGuiaCfg(), d=trDestinatario(t), c=g.carga;
  const ini=new Date(t.guia.inicioTs||trNovoInicio());
  const dia=ini.getFullYear()+'-'+two(ini.getMonth()+1)+'-'+two(ini.getDate());
  const fim=new Date(ini.getTime()+30*60000);
  return { nif:d.nif, nome:d.nome, morada:d.morada, cp:d.codigoPostal, loc:d.localidade,
    cargaMorada:c.morada, cargaCp:c.codigoPostal, cargaLoc:c.localidade,
    data:dia, hora:hhmm(ini.getTime()), descargaData:dia, descargaHora:hhmm(fim.getTime()),
    matricula:t.viatura||'', bens:trBens(j).map(b=>({ d:b.descricao, q:b.qtd, u:b.unidade })),
    // Carimbo e referência: a extensão usa-os para dizer de que entrega são estes dados e
    // para avisar quando são velhos — já aconteceu preencher a guia com a entrega anterior.
    ts:nowTs(), ref:(t.relId||j.id||''), destino:(d.nome||'') };
}

      el('button',{class:'segbtn',style:c.estado==='dano'?'border-color:var(--pause);color:var(--pause);background:var(--pausedim)':'',onclick:()=>{ c.estado='dano'; save(); render(); }},'⚠️ Com dano')));
    if(c.estado==='dano'){

      (c.danos||[]).forEach((k,n)=>{ const th=_trThumb[k]; ds.append(el('div',{class:'trslot cheio dano'}, th?el('img',{src:th,alt:''}):'✓', el('button',{class:'trx',onclick:()=>trApagarDano(j,c.uid,n)},'✕'))); });
      ds.append(el('button',{class:'trslot',onclick:()=>trFotoDano(j,c.uid)},'📷', el('span',{},'Foto do dano')));
      card.append(ds);

  });
  w.append(el('p',{class:'lbl'},'Verificação na descarga'));
  TR_CHECK.forEach(q=>{ w.append(el('div',{class:'item',style:'flex-direction:column;align-items:stretch;gap:8px;margin-bottom:8px'}, el('b',{style:'font-size:14.5px'},q.t),
    el('div',{class:'seg',style:'margin:0'},
      el('button',{class:'segbtn'+(t.checklist[q.k]==='sim'?' on':''),onclick:()=>{ t.checklist[q.k]='sim'; save(); render(); }},'Sim'),
      el('button',{class:'segbtn',style:t.checklist[q.k]==='nao'?'border-color:var(--alarm);color:var(--alarm);background:var(--alarmdim)':'',onclick:()=>{ t.checklist[q.k]='nao'; save(); render(); }},'Não')))); });
  w.append(el('p',{class:'lbl'},'Observações'));
  w.append(el('textarea',{class:'serbox',id:'trObs',style:'font-family:var(--sans)',oninput:(e)=>{ t.observacoes=e.target.value; save(); }}, t.observacoes||''));
  w.append(el('button',{class:'big',style:'margin-top:14px',onclick:()=>trIrFase(j,'rececao')},'Seguinte: receção na ANN ›'));
}
function trRenderRececao(w,j){
  const t=j.transp; const r=t.recetor; trCarregarMedia(j);
  const nDano=t.caixas.filter(c=>c.estado==='dano').length;
  w.append(el('p',{class:'lbl'},'6. Receção na ANN'));
  w.append(el('div',{class:'planobar',style:'display:block'}, el('div',{class:'sub'},'Quem recebe na ANN confirma que'),
    el('div',{style:'margin-top:6px;font-style:italic'}, '«Recebi as '+trNCaixas(j)+' caixa(s) identificadas neste relatório, conformes e no estado documentado nas fotografias'+(nDano?(', incluindo os '+nDano+' dano(s) assinalado(s)'):'')+'.»')));
  // 16-09-2026 — "quando o da Aernnova assina não sabe o que está a assinar". Antes de assinar,
  // mostra-se-lhe em letra grande o que vai no relatório: cada caixa, o estado e as horas; e um
  // botão que abre o relatório com as fotografias, para ele ver antes de pôr o dedo.
  const resumo=el('div',{class:'trcpgrupo'}, el('h4',{},'O que vai assinar'));
  t.caixas.forEach((c,i)=>resumo.append(el('div',{class:'trcp'},
    el('div',{class:'tv'}, el('small',{}, (i+1)+' · '+(c.tipo==='lote'?(c.qtd+' caixa(s), sem nº de série'):('série '+c.serie))), el('b',{}, c.artigo)),
    el('span',{class:'badge '+(c.estado==='dano'?'pause':'run')}, c.estado==='dano'?'⚠ com dano':'✓ sem danos'))));
  resumo.append(el('div',{class:'trcp'}, el('div',{class:'tv'}, el('small',{},'Horas'),
    el('b',{}, 'chegada '+(t.ts.chegada?hhmm(t.ts.chegada):'—')+' · descarga '+(t.ts.descarga?hhmm(t.ts.descarga):'—')+' · espera '+trHM(trEsperaMs(j))))));
  w.append(resumo);
  w.append(el('button',{class:'big',style:'margin:4px 0 14px;padding:20px;font-size:17px',onclick:()=>trVerRelatorio(j)},'👁  Mostrar as fotos e o relatório a quem assina'));
  const dl=el('datalist',{id:'trdlrec'}); trRecetoresConhecidos().forEach(x=>dl.append(el('option',{value:x.nome})));
  w.append(el('p',{class:'lbl'},'Nome de quem recebe'), el('input',{class:'search',id:'trRecNome',list:'trdlrec',autocomplete:'off',value:r.nome||'',oninput:(e)=>trSetRecetor(j,'nome',e.target.value)}), dl);
  // O email da pessoa da ANN saiu daqui: nunca serviu para enviar nada (o relatório vai só
  // para a Sónia, que reencaminha) e no tablet era mais uma coisa para escrever.
  w.append(el('div',{class:'muted',id:'trDestinos',style:'margin:-4px 0 12px'}, trTextoDestinos(j)));
  w.append(el('div',{class:'trsigh'}, el('b',{},'Assinatura de quem recebe (ANN)'), el('span',{class:'chip',id:'trStAnn'}, t.assinado.ann?'✓ assinado':'por assinar')));
  if(!r.recusou){ w.append(el('canvas',{class:'trsig',id:'trSigAnn'})); w.append(el('button',{class:'back',style:'margin-top:6px',onclick:()=>trLimparAss(j,'ann')},'Limpar')); }
  const cb=el('input',{type:'checkbox',onchange:(e)=>trSetRecusa(j,e.target.checked)}); cb.checked=!!r.recusou;
  w.append(el('label',{class:'trchk'}, cb, 'A pessoa da ANN não quis assinar'));
  if(r.recusou) w.append(el('p',{class:'lbl'},'Porquê? O que disse'), el('textarea',{class:'serbox',id:'trRecMotivo',style:'font-family:var(--sans)',oninput:(e)=>{ r.motivo=e.target.value; save(); }}, r.motivo||''));
  w.append(el('div',{class:'trsigh',style:'margin-top:16px'}, el('b',{},'Assinatura do motorista — '+curto(((j.workers||[])[0]||{}).op||'')), el('span',{class:'chip',id:'trStMot'}, t.assinado.mot?'✓ assinado':'por assinar')));
  w.append(el('canvas',{class:'trsig',id:'trSigMot'})); w.append(el('button',{class:'back',style:'margin-top:6px',onclick:()=>trLimparAss(j,'mot')},'Limpar'));
  w.append(el('button',{class:'big ghost',style:'margin-top:16px',onclick:()=>trVerRelatorio(j)},'👁  Ver o relatório antes de enviar'));
  const bFim=el('button',{class:'big ok',style:'margin-top:10px',onclick:()=>trConcluir(j)}, state._trAEnviar?'A preparar o relatório…':'✅  Confirmar receção e concluir'); bFim.disabled=!!state._trAEnviar;
  w.append(bFim);
  w.append(el('button',{class:'big ghost',style:'margin-top:10px',onclick:()=>trVoltar(j,'descarga')},'‹ Voltar às fotos'));
}

  w.append(el('div',{style:'text-align:center;padding:26px 0 10px'},

/* ---- helpers UI ---- */
function backbar(to,title){ return el('div',{class:'backbar'},
  el('button',{class:'back',onclick:()=>{ if(to==='board'){state.view='board';} else {state.view=to;} render(); }},'‹ Voltar'),
  el('div',{class:'crumb'}, el('b',{},title))); }
function curto(nome){ if(!nome)return''; const p=nome.trim().split(/\s+/); return p.length>1?(p[0][0]+'. '+p[p.length-1]):p[0]; }
function toast(m,k){ state.toast={m,k}; render(); clearTimeout(window._tt); window._tt=setTimeout(()=>{state.toast=null;render();},2200); }

/* ---- relógio + timers ---- */
setInterval(()=>{
  const c=$('#clk'); if(c)c.textContent=hhmm(nowTs());
  document.querySelectorAll('.timer[data-job]').forEach(t=>{ const j=state.jobs.find(x=>x.id===t.getAttribute('data-job')); if(j)t.textContent=fmtDur(j.transp?trTotalMs(j):activeMs(j)); });
  document.querySelectorAll('[data-ttotal]').forEach(t=>{ const j=state.jobs.find(x=>x.id===t.getAttribute('data-ttotal')); if(j&&j.transp)t.textContent=fmtDur(trTotalMs(j)); });
  document.querySelectorAll('[data-tespera]').forEach(t=>{ const j=state.jobs.find(x=>x.id===t.getAttribute('data-tespera')); if(j&&j.transp)t.textContent=fmtDur(trEsperaMs(j)); });
  document.querySelectorAll('.minigauge[data-gj]').forEach(g=>{ const j=state.jobs.find(x=>x.id===g.getAttribute('data-gj')); if(j)g.innerHTML=gaugeMini(activeMs(j),objetivoMsJob(j)); });
  document.querySelectorAll('[data-pert]').forEach(t=>{ const p=state.perts.find(x=>x.id===t.getAttribute('data-pert')); if(p)t.textContent=fmtDur(nowTs()-p.startTs); });
  if(state.view==='job'){ const j=curJob();
    if(j){ const jt=document.querySelector('[data-jtimer]'); if(jt)jt.textContent=fmtDur(activeMs(j));
      const g=$('#gaugewrap'); if(g){ g.innerHTML=''; g.append(gaugeInner(activeMs(j),objetivoMsJob(j))); } } }
},1000);

/* ---- arranque ---- */
(async function init(){
  ensureDeviceName();   // pergunta o nome do aparelho se ainda não tiver (nunca fica "Sem nome")
  try{ state.jobs=JSON.parse(localStorage.getItem(LS.jobs)||'[]'); }catch(e){ state.jobs=[]; }
  // migrar/limpar: formato antigo -> workers; descartar trabalhos sem operador
  state.jobs=(state.jobs||[]).map(j=>{ if(!j) return null;
    if(!j.workers){ j.workers=[{op:j.op||'', opCurto:j.opCurto||curto(j.op||''), pin:j.pin||'', startTs:j.startTs||nowTs(), pauses:j.pauses||[], status:(j.status==='paused'?'paused':'running'), endTs:(j.status==='done'?(j.endTs||nowTs()):null)}]; j.status=(j.status==='done'?'done':'open'); }
    (j.workers||[]).forEach(w=>{ if(!w.opCurto) w.opCurto=curto(w.op||''); });
    return j;
  }).filter(j=> j && j.workers && j.workers.some(w=>(w.op||'').trim()));
  try{ state.perts=JSON.parse(localStorage.getItem(LS.perts)||'[]'); }catch(e){ state.perts=[]; }
  // (os trabalhos e paragens de dias anteriores são encerrados por fecharFimDeTurno,
  //  mais abaixo — já com a config carregada, para o registo sair completo)
  state.cfg=await loadConfig();
  if(!state.cfg){ $('#app').innerHTML='<div class="wrap"><div class="empty">Não consegui carregar a configuração (config.json).</div></div>'; return; }
  state.enc=await loadEnc();
  fecharFimDeTurno();       // põe as contas em dia se ficou algo aberto da véspera
  state.view='board'; render();
  reconcileTrabAbertos();   // recuperar JA os trabalhos que este aparelho tenha perdido
  window.addEventListener('online',()=>{ syncQueue(); syncPertQueue(); syncStockQ(); });
})();

/* ---- Wake Lock: manter o ecrã aceso (telemóveis não auto-bloqueiam → continuam a enviar batimento e ficam visíveis no Painel) ---- */
(function(){
  let wl=null;
  async function pedir(){ try{ if('wakeLock' in navigator && document.visibilityState==='visible'){ wl=await navigator.wakeLock.request('screen'); } }catch(e){} }
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ pedir(); if(typeof enviarBatimento==='function') enviarBatimento(); } });
  document.addEventListener('click',()=>{ if(!wl || wl.released) pedir(); }, {passive:true});
  pedir();
})();

/* ---- Service Worker (offline) + aviso de versao nova ---- */
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
(function(){
  var vAtual=null, haNova=false;
  // 10-09-2026 — com um trabalho aberto so aparecia o aviso "toca para atualizar", e ninguem tocava:
  // o Monitor-Fracoes, o 7ZO9 e o telemovel do Rui, sempre com trabalho, ficaram 2 dias numa versao
  // que deixava o "Tipo Caixa" em branco. Os trabalhos, as pausas e os registos por enviar estao todos
  // guardados no aparelho, por isso recarregar nao perde nada. So nao se recarrega com alguem a mexer.
  var ultimoToque=Date.now(), visivelDesde=Date.now();
  ['pointerdown','touchstart','keydown'].forEach(function(ev){ document.addEventListener(ev,function(){ ultimoToque=Date.now(); },{passive:true,capture:true}); });
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') visivelDesde=Date.now(); });
  async function verVersao(){
    try{ var r=await fetch('version.json?_='+Date.now(),{cache:'no-store'}); if(!r.ok) return;
      var v=(await r.json()).v;
      if(vAtual===null){ vAtual=v; return; }
      if(v!==vAtual){ haNova=true; mostrarAtualizar(); }
    }catch(e){}
  }
  function temTrabalhoAtivo(){ return (state.jobs||[]).some(function(j){ return (j.workers||[]).some(function(w){ return !w.endTs; }); }); }
  function podeRecarregar(){
    if(typeof _syncing!=='undefined' && _syncing) return false;     // a meio de enviar registos: podia duplicar linhas
    if(typeof _syncingP!=='undefined' && _syncingP) return false;   // idem, paragens
    if(state.view && state.view!=='board') return false;             // a meio de um PIN, formulario, etc.
    if(Date.now()-ultimoToque < 120000) return false;                // mexeram ha menos de 2 minutos
    if(!temTrabalhoAtivo()) return true;
    if(document.visibilityState!=='visible') return false;           // ecra apagado: espera que acorde
    if(Date.now()-visivelDesde < 20000) return false;                // acabou de acordar: alguem vai pegar nele
    return true;
  }
  function mostrarAtualizar(){
    if(podeRecarregar()){ location.reload(); return; }
    if(document.getElementById('nv')) return;
    var b=document.createElement('div'); b.id='nv';
    b.style.cssText='position:fixed;left:0;right:0;bottom:0;background:#26c9e2;color:#04222a;font-weight:700;text-align:center;padding:12px;z-index:9999;cursor:pointer;font-family:system-ui';
    b.textContent='🔄 Nova versão disponível — toca para atualizar';
    b.onclick=function(){ location.reload(); };
    document.body.appendChild(b);
  }
  verVersao(); setInterval(verVersao, 180000);  // verifica de 3 em 3 min
  setInterval(function(){ if(haNova && podeRecarregar()) location.reload(); }, 30000);   // ja ha versao nova: tenta de 30 em 30 s
})();

/* ---- manter o ecra ACESO enquanto o quiosque esta aberto (evita suspensao) ---- */
(function(){
  var wl=null;
  async function pedir(){ try{ if('wakeLock' in navigator){ wl=await navigator.wakeLock.request('screen'); } }catch(e){} }
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') pedir(); });
  document.addEventListener('click', pedir, { once:false });   // reforca apos toque (alguns browsers exigem gesto)
  pedir();
})();

/* ---- re-verificar a lista de operadores/config de 2 em 2 min (novos aparecem sozinhos) ---- */
setInterval(async function(){ try{ var c=await loadConfig(); if(c && c.operadores){ state.cfg=c; } }catch(e){} }, 120000);
/* ---- re-carregar encomendas live de 5 em 5 min ---- */
setInterval(async function(){ try{ var e=await loadEnc(); if(e && e.length){ state.enc=e; } }catch(e){} }, 300000);
</script>
