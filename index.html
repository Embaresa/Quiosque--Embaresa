<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Quiosque Produção — Embaresa</title>
<style>
  :root{
    --bg:#080d12; --panel:#0d151c; --card:#13202b; --card2:#172733;
    --ink:#e9f1f6; --soft:#8ba0af; --faint:#5c7080; --line:#223240;
    --cy:#26c9e2; --cydim:#0e2a33;
    --run:#34d399; --rundim:#0f2e26; --pause:#f5b52b; --pausedim:#33280c;
    --alarm:#f2617a; --alarmdim:#33141c;
    --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
    --sans:"Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.4;
    overscroll-behavior:none;-webkit-font-smoothing:antialiased}
  #app{max-width:920px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  button{font-family:inherit;font-size:16px;cursor:pointer;border:none;color:inherit;background:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
    border-bottom:1px solid var(--line);background:linear-gradient(180deg,#101c26,#0d161e);position:sticky;top:0;z-index:5}
  .topbar .area{display:flex;align-items:center;gap:10px;font-weight:700}
  .pip{width:9px;height:9px;border-radius:50%;background:var(--cy);box-shadow:0 0 10px var(--cy)}
  .topbar .right{display:flex;align-items:center;gap:14px;font-family:var(--mono)}
  .clock{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
  .sub{font-size:11px;color:var(--soft)}
  .sync{font-size:11px;display:flex;align-items:center;gap:6px}
  .sync .d{width:7px;height:7px;border-radius:50%}
  .sync.on .d{background:var(--run);box-shadow:0 0 8px var(--run)} .sync.on{color:var(--run)}
  .sync.off .d{background:var(--pause)} .sync.off{color:var(--pause)}
  .wrap{flex:1;padding:16px;display:flex;flex-direction:column}
  h2{font-size:18px;margin:0 0 4px} .muted{color:var(--soft);font-size:13px;margin:0 0 16px}

  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .m{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;position:relative;overflow:hidden;text-align:left;width:100%}
  .m::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
  .m.run::before{background:var(--run)} .m.pause::before{background:var(--pause)}
  .m .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:2px}
  .m .prog{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
  .m .art{font-weight:700;font-size:15px;margin:2px 0 8px;line-height:1.25}
  .badge{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px;white-space:nowrap;flex:none}
  .badge.run{color:var(--run);background:var(--rundim)} .badge.pause{color:var(--pause);background:var(--pausedim)}
  .m .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
  .m .op{font-size:12px;color:var(--soft)} .m .op b{color:var(--ink);display:block;font-size:12.5px}
  .m .timer{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
  .m.run .timer{color:var(--run)} .m.pause .timer{color:var(--pause)}
  .m .ser{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .m .rsn{font-size:11.5px;color:var(--pause);margin-top:6px}
  .empty{color:var(--faint);text-align:center;padding:40px 0;font-style:italic}

  /* quadro em 2 colunas: trabalhos à esquerda, ações à direita */
  .boardlayout{flex:1;display:flex;align-items:stretch;min-height:0}
  .boardlayout .wrap{flex:1;min-width:0;overflow:auto}
  .cta{flex:none;width:300px;padding:16px;border-left:1px solid var(--line);align-self:stretch;
    display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,var(--panel),transparent)}
  .cta .ctahd{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:2px 0 2px}
  @media(max-width:760px){
    .boardlayout{flex-direction:column}
    .cta{width:auto;border-left:none;border-top:1px solid var(--line);position:sticky;bottom:0;background:linear-gradient(0deg,var(--bg),transparent)}
    .cta .ctahd{display:none}
  }
  .big{width:100%;background:linear-gradient(180deg,#1ec6df,#12a7bf);color:#04222a;border-radius:12px;padding:17px;
    font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px}
  .big.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
  .big.danger{background:var(--alarmdim);color:var(--alarm);border:1px solid #4a2029}
  .big.warn{background:var(--pausedim);color:var(--pause);border:1px solid #4a3a12}
  .big.ok{background:var(--rundim);color:var(--run);border:1px solid #1c4a3c}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:14px 0 8px}
  .pin-disp{font-family:var(--mono);font-size:30px;letter-spacing:.35em;text-align:center;background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;min-height:62px}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .key{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:18px;text-align:center;font-family:var(--mono);font-size:22px;font-weight:600}
  .key.del{color:var(--soft)} .key.ok{background:var(--rundim);color:var(--run)}
  .list{display:flex;flex-direction:column;gap:9px}
  .item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px;text-align:left;width:100%}
  .item:active{border-color:var(--cy)}
  .item .t{flex:1} .item .t b{font-size:15px} .item .t small{display:block;color:var(--soft);font-size:12px;margin-top:2px}
  .item .chev{color:var(--faint);font-size:18px}
  .item .pfx{font-family:var(--mono);font-size:11px;color:var(--cy);min-width:42px}
  .search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px;color:var(--ink);font-size:16px;margin-bottom:12px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;padding:5px 10px;border-radius:20px;border:1px solid var(--line);color:var(--soft)}
  .autoinfo{display:flex;gap:10px;margin:2px 0 14px;flex-wrap:wrap}
  .autoinfo .ai{flex:1;min-width:130px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--cy);border-radius:10px;padding:9px 12px}
  .autoinfo .ai small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
  .autoinfo .ai b{font-size:14.5px;color:var(--ink)}
  .backbar{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .back{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:9px 14px;font-size:14px;color:var(--soft)}
  .crumb{font-size:13px;color:var(--soft)}
  .crumb b{color:var(--ink)}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .segbtn{padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;color:var(--soft)}
  .segbtn.on{border-color:var(--cy);background:var(--cydim);color:var(--cy)}
  .serbox{width:100%;min-height:90px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);font-family:var(--mono);font-size:15px;resize:vertical}
  .reasons{display:flex;flex-wrap:wrap;gap:8px}
  .rc{font-size:13px;padding:10px 13px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--soft)}
  .rc.on{border-color:var(--pause);color:var(--pause);background:var(--pausedim)}
  .qtybox{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0}
  .qtybox button{width:52px;height:52px;border-radius:9px;background:var(--card2);border:1px solid var(--line);font-size:26px;font-weight:700}
  .qtybox .v{flex:1;text-align:center;font-family:var(--mono);font-size:30px;font-weight:700}
  .planobar{background:var(--cydim);border:1px solid #14414e;border-radius:10px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;margin:10px 0}
  .planobar .pi{font-size:13px} .planobar .pi b{color:var(--cy)}
  .verplano{background:var(--cy);color:#04222a;border-radius:8px;padding:9px 14px;font-weight:700;font-size:13px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);
    border-radius:10px;padding:12px 18px;font-size:14px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90%}
  .toast.ok{border-color:#1c4a3c;color:var(--run)} .toast.err{border-color:#4a2029;color:var(--alarm)}
  .flag{background:var(--pausedim);border:1px solid #4a3a12;color:var(--pause);border-radius:8px;padding:10px 13px;font-size:12.5px;margin-bottom:10px}

  /* ---- transporte para a ANN ---- */
  .toast{z-index:200000}
  .trcab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
  .trtotal{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--run);font-variant-numeric:tabular-nums}
  .trhoras{display:flex;gap:14px}
  .trh{text-align:center} .trh small{display:block;font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em} .trh b{font-family:var(--mono);font-size:15px}
  .trespera{background:var(--pausedim);border:1px solid #4a3a12;color:var(--pause);border-radius:10px;padding:10px 13px;margin-bottom:8px;font-size:14px} .trespera b{font-family:var(--mono)}
  .trfases{display:flex;gap:6px;overflow-x:auto;margin:4px 0 10px;padding-bottom:2px}
  .trf{flex:none;font-size:12px;font-weight:600;padding:6px 10px;border-radius:20px;border:1px solid var(--line);color:var(--soft);white-space:nowrap}
  .trf.on{background:var(--cydim);border-color:var(--cy);color:var(--cy)} .trf.feito{color:var(--run);border-color:#1c4a3c}
  .trchips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 2px 8px}
  .trqtd{width:90px;flex:none;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--ink);font-family:var(--mono);font-size:18px;text-align:center}
  .trcx{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px} .trcx.ok{border-color:#1c4a3c}
  .trcxh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
  .trslots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .trslot{position:relative;aspect-ratio:1/1;border:2px dashed var(--line);border-radius:11px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:26px;overflow:hidden;padding:4px}
  .trslot span{font-size:11px;font-weight:700;color:var(--soft);text-align:center;line-height:1.15}
  .trslot.cheio{border:2px solid var(--run);padding:0} .trslot.cheio.dano{border-color:var(--pause)}
  .trslot.cheio img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .trslot.cheio span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;padding:3px}
  .trx{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);color:#fff;border-radius:7px;padding:2px 8px;font-size:14px}
  .trsig{display:block;width:100%;height:170px;border-radius:11px;background:#fff;touch-action:none;margin-top:8px}
  .trsigh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
  .trchk{display:flex;align-items:center;gap:10px;margin:12px 0;font-weight:600} .trchk input{width:22px;height:22px}
  .trcam{position:fixed;inset:0;z-index:100000;background:#000;display:flex;flex-direction:column}
  .trcam video{flex:1;width:100%;min-height:0;object-fit:contain;background:#000}
  .trcamtopo{color:#fff;padding:12px 14px;background:#111;display:flex;flex-direction:column;gap:2px} .trcamtopo small{opacity:.8}
  .trcambar{display:flex;gap:10px;justify-content:center;padding:14px 12px;background:#111}
  .trcamb{border-radius:14px;padding:15px 16px;font-weight:800;color:#fff;background:#475569}
  .trcamb.azul{background:#2563eb;padding:15px 26px;font-size:18px}
  .trmodal{position:fixed;inset:0;z-index:90000;background:rgba(0,0,0,.7);display:flex;padding:10px}
  .trmodalbox{flex:1;background:#fff;border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
  .trmodalh{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:#10243e;border-bottom:1px solid #dbe2ea}
  .trmodal iframe{flex:1;border:0;width:100%}
  .trcpgrupo{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin-bottom:10px}
  .trcpgrupo h4{margin:6px 0 2px;font-size:11px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--cy)}
  .trcp{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .trcp:first-of-type{border-top:none}
  .trcp .tv{flex:1;min-width:0} .trcp .tv small{display:block;font-size:11px;color:var(--faint)} .trcp .tv b{display:block;font-size:15px;word-break:break-word}
  .trcpb{flex:none;background:var(--cydim);border:1px solid #14414e;color:var(--cy);border-radius:9px;padding:10px 14px;font-weight:700;font-size:14px}
  .trcpb.ok{background:var(--rundim);border-color:#1c4a3c;color:var(--run)}
</style>

<body>
<div id="app"><div class="wrap"><div class="empty">A carregar…</div></div></div>

<script>
"use strict";
/* ============================================================
   QUIOSQUE DE PRODUÇÃO — Embaresa · v0.1 (self-contained)
   Local-first: cada evento é guardado no instante. Offline OK.
   ============================================================ */
const LS = {
  cfg:'q_config_cache', jobs:'q_jobs', queue:'q_sync_queue', done:'q_done_hoje', perts:'q_perts', pertq:'q_pert_queue', sent:'q_sent_ids'
};
const state = { cfg:null, view:'load', op:null, jobs:[], perts:[], draft:null, toast:null };

/* ---------- utilidades ---------- */
const $ = (s)=>document.querySelector(s);
const el = (t,a={},...c)=>{ const e=document.createElement(t);
  for(const k in a){ if(k==='class')e.className=a[k]; else if(k==='html')e.innerHTML=a[k]; else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]); else e.setAttribute(k,a[k]); }
  for(const x of c){ if(x==null)continue; e.append(x.nodeType?x:document.createTextNode(x)); } return e; };
function nowTs(){ return Date.now(); }
function two(n){ return (n<10?'0':'')+n; }
function hhmm(ts){ const d=new Date(ts); return two(d.getHours())+':'+two(d.getMinutes()); }
function dstr(ts){ const d=new Date(ts); return d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate()); }
function fmtDur(ms){ const s=Math.floor(ms/1000); const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=s%60; return two(h)+':'+two(m)+':'+two(ss); }
function fmtMin(ms){ const m=Math.round(ms/60000); const h=Math.floor(m/60); return h>0?(h+'h '+(m%60)+'min'):(m+'min'); }
function save(){ try{ localStorage.setItem(LS.jobs,JSON.stringify(state.jobs)); }catch(e){} if(typeof agendarBatimento==='function')agendarBatimento(); }
function saveP(){ try{ localStorage.setItem(LS.perts,JSON.stringify(state.perts)); }catch(e){} }
function saveQueue(q){ try{ localStorage.setItem(LS.queue,JSON.stringify(q)); }catch(e){} }
function loadQueue(){ try{ return JSON.parse(localStorage.getItem(LS.queue)||'[]'); }catch(e){ return []; } }
function loadPertQ(){ try{ return JSON.parse(localStorage.getItem(LS.pertq)||'[]'); }catch(e){ return []; } }
function savePertQ(q){ try{ localStorage.setItem(LS.pertq,JSON.stringify(q)); }catch(e){} }
/* ---- anti-duplicados: registo de IDs ja enviados com sucesso ---- */
function sentIds(){ try{ return JSON.parse(localStorage.getItem(LS.sent)||'[]'); }catch(e){ return []; } }
function jaEnviado(id){ return id && sentIds().indexOf(id)!==-1; }
function marcarEnviado(id){ try{ if(!id)return; let s=sentIds(); if(s.indexOf(id)===-1){ s.push(id); if(s.length>800) s=s.slice(-800); localStorage.setItem(LS.sent,JSON.stringify(s)); } }catch(e){} }
function pertRecord(op,motivo,ini,fim){ return { IDRegisto:'P'+Date.now()+Math.floor(Math.random()*1000), Data:dstr(ini), Colaborador:op, TipoPerturbacao:motivo, HoraInicio:hhmm(ini), HoraFim:hhmm(fim), Duracao:Math.round(Math.max(0,fim-ini)/60000).toString(), DataHoraRegisto:new Date().toLocaleString('pt-PT') }; }
function enqueuePerturbacao(rec){ const q=loadPertQ(); q.push(rec); savePertQ(q); syncPertQueue(); }

/* ---- FECHO AUTOMÁTICO AO FIM DO DIA (meia-noite) ----
   Nada fica aberto de um dia para o outro. Uma janela do quiosque esquecida aberta
   continuava a marcar tempo e a mandar batimentos com a sessão da véspera: no monitor
   das Frações uma segunda janela repetiu as 14:06 do dia anterior durante 20 horas, e
   o Painel mostrava esse estado em vez do de hoje.
   Corre de minuto a minuto E ao arrancar — uma janela adormecida pode não ter corrido
   o temporizador à hora certa, e ao acordar tem de pôr as contas em dia.
   O trabalho NÃO é dado como concluído: fica registado o tempo até ao fim do dia com
   OperacaoConcluida=Não, para no dia seguinte se retomar a operação onde ficou.
   A hora gravada é 23:59 e não 00:00, para o registo ficar no dia a que pertence em
   vez de saltar para o dia seguinte. */
const HORA_FECHO = 23, MIN_FECHO = 59;   // fim do dia
function limiteTurno(ts){
  const d = new Date(ts); d.setHours(HORA_FECHO,MIN_FECHO,0,0);
  if(d.getTime() <= ts) d.setDate(d.getDate()+1);   // começou já depois disso → conta para o dia seguinte
  return d.getTime();
}
function fecharFimDeTurno(){
  if(_deLado) return;   // janela de lado: nao fecha nada, para nao escrever fantasmas
  const agora = nowTs(); let nT=0, nP=0, mudou=false;
  // DUAS JANELAS DO MESMO POSTO partilham o localStorage, mas cada uma guarda o seu estado
  // em memória. Uma aba esquecida de manhã continua a achar que tem paragens e trabalhos
  // abertos que entretanto foram fechados na aba boa — e às 23:59 escrevia-os na nuvem, com
  // quinze horas de duração. O armazenamento é a verdade: o que já lá não está, já acabou.
  let guardado = null;
  try{ guardado = { p: JSON.parse(localStorage.getItem(LS.perts)||'[]')||[],
                    j: JSON.parse(localStorage.getItem(LS.jobs)||'[]')||[] }; }catch(e){ guardado = null; }
  let jobG = null;
  if(guardado){
    const vivos={}; guardado.p.forEach(x=>{ if(x&&x.id) vivos[x.id]=true; });
    state.perts = (state.perts||[]).filter(x=>vivos[x.id]);
    jobG = {}; guardado.j.forEach(x=>{ if(x&&x.id) jobG[x.id]=x; });
  }
  const jaFechadoNoutraJanela = (j, wk)=>{
    if(!jobG) return false;                 // sem armazenamento legível, comporta-se como antes
    const g = jobG[j.id];
    if(!g || g.status==='done') return true;
    return (g.workers||[]).some(x=> x.op===wk.op && x.startTs===wk.startTs && !!x.endTs);
  };
  // paragens ainda a correr
  (state.perts||[]).slice().forEach(p=>{
    const lim = limiteTurno(p.startTs);
    if(agora <= lim) return;
    enqueuePerturbacao(pertRecord(p.op, p.motivo, p.startTs, lim));
    state.perts = state.perts.filter(x=>x.id!==p.id); nP++; mudou=true;
  });
  if(nP) saveP();
  // trabalhos ainda a correr
  (state.jobs||[]).forEach(j=>{
    if(j.status==='done') return;
    let fechei=false;
    (j.workers||[]).forEach(wk=>{
      if(wk.endTs) return;
      if(jaFechadoNoutraJanela(j, wk)) return;
      const lim = limiteTurno(wk.startTs);
      if(agora <= lim) return;
      const pa = (wk.pauses||[])[ (wk.pauses||[]).length-1 ];
      if(pa && !pa.end){ pa.end = Math.max(pa.start, lim); if(pa.motivo) enqueuePerturbacao(pertRecord(wk.op, pa.motivo, pa.start, pa.end)); }
      // transporte parado à porta da ANN à meia-noite: a espera até às 23:59 também conta como paragem
      const tr = j.transp;
      if(tr && tr.ts && tr.ts.chegada && !tr.ts.descarga && !tr.esperaRegistada && lim-tr.ts.chegada>=60000){
        const tipoE = trTipoEspera();
        (wk.pauses=wk.pauses||[]).push({start:tr.ts.chegada, end:lim, motivo:tipoE});
        enqueuePerturbacao(pertRecord(wk.op, tipoE, tr.ts.chegada, lim));
        tr.esperaRegistada = true;
      }
      wk.endTs = lim; wk.status = 'parado';
      enqueueRegisto(j, wk, false);   // regista o tempo; a operação fica por concluir
      nT++; fechei=true; mudou=true;
    });
    if(fechei && !(j.workers||[]).some(w=>!w.endTs)){ j.status='done'; try{ pushTrabAberto(j,'fechado'); }catch(e){} }
  });
  if(mudou){
    save();
    if(typeof guardarNoDisco==='function') guardarNoDisco();
    if(typeof agendarBatimento==='function') agendarBatimento();
    if(state.view==='board') render();
    toast('Fecho do dia — '+nT+' trabalho(s) e '+nP+' paragem(ns) encerrados às 23:59','ok');
  }
}

// UNIDADE A PARTIR DO CATALOGO
// Os trabalhos recuperados da nuvem trazem a unidade da tabela dos trabalhos abertos, e se
// essa vier vazia todos os registos desse trabalho iam para o Excel SEM unidade — foi o que
// aconteceu a 11 registos entre julho e setembro. Aqui vai-se buscar ao catalogo.
// A mesma operacao pode ser feita em unidades diferentes conforme o ARTIGO (o
// "E1-Frac-Preparação e Montagem" e feito em Évora 2, menos a E1-Embalagem NMF que e em

// Programa nessa coluna. Um trabalho recuperado da nuvem sem programa deixava a coluna vazia
// (204 registos). O programa está no catálogo, ao lado do artigo.
function programaDoArtigo(artigo){
  const n=s=>String(s||'').trim().toLowerCase();
  const a=((state.cfg&&state.cfg.artigos)||[]).find(x=>n(x.artigo)===n(artigo));
  return a?(a.programa||''):'';

function unidadeDaOp(operacao, artigo){
  const ops=(state.cfg&&state.cfg.operacoes)||[];
  const n=s=>String(s||'').trim().toLowerCase();
  const iguais=ops.filter(o=>n(o.operacao)===n(operacao));
  if(!iguais.length) return '';
  if(artigo){
    const exato=iguais.find(o=>(o.artigos||[]).some(a=>n(a)===n(artigo)));
    if(exato) return exato.unidade||'';
  }
  return iguais.length===1 ? (iguais[0].unidade||'') : '';   // ambiguo sem artigo: melhor vazio do que errado

function tryLogin(){
  if(state.intent==='fecharAntigos'){   // ação de supervisor, não dos operadores
    if(String(state.pinbuf)===PIN_SUPERVISOR){ state.pinbuf=''; state.intent=null; state.view='fecharAntigos'; render(); return; }
    toast('Só o supervisor pode fechar trabalhos.','err'); state.pinbuf=''; render(); return;
  }
  const op=state.cfg.operadores.find(o=>String(o.pin)===String(state.pinbuf));
  if(!op){ toast('PIN não reconhecido','err'); state.pinbuf=''; render(); return; }
  state.pendingOp=op; state.view='confirma'; render();

function confirmOp(){
  const op=state.pendingOp; if(!op){ state.view='pin'; return render(); }
  state.op=op; state.area=areaUnidades(op); state.allowedArt=artigosDaArea();
  state.pendingOp=null; state.pinbuf='';

  else if(state.intent==='jobaction'){ state.curJob=state.jobActionId; state.jobPhase='menu'; state.view='job'; }

    state.smov=null; state._sopen=null; state._af=''; state.view='stockmap'; render(); loadStockMap().then(()=>{ if((state.view||'').indexOf('stock')===0) render(); }); return; }

// PARA OS TRANSPORTES, MOVER MATERIAL NAO E PARAGEM — E O TRABALHO
// Movimentar e organizar material e paragem para quem esta a montar uma caixa (a caixa ficou
// a espera), mas e a propria funcao de quem faz logistica. Estes motivos tem OPERACAO
// equivalente no catalogo (programa Logistica), e por isso saem da lista das paragens para
// quem esta na seccao Transportes. A Taffaly ja lancava pela operacao; o Rui lancava tudo
// pela paragem — 643 h no sitio errado, que arrastavam o OEE da fabrica inteira para baixo.
// Esconder e melhor do que avisar: pedir a alguem que se lembre, 243 vezes, nao funcionou.
const PERT_QUE_SAO_TRABALHO_NA_LOGISTICA = /organiza|movimenta|descarga cami|limpeza cami/i;
// Paragens reservadas a uma pessoa. A Sonia (09-09-2026): "a gestao de equipa apenas pode
// ser utilizada pelo Rui" — e o que ela escreveu na folha ConfigPerturbacoes ("apenas para Rui Richau").
const PERT_SO_PARA = [ { re:/gest[ãa]o\s*equipa/i, quem:/rich/i } ];
function motivosParaEsteOperador(){
  const todos = (state.cfg && state.cfg.perturbacoes) || [];
  const nome = String((state.op && state.op.nome) || '');
  const sec = String((state.op && state.op.seccao) || '');
  let lista = todos.filter(m => !PERT_SO_PARA.some(x => x.re.test(String(m||'')) && !x.quem.test(nome)));
  if(/transp/i.test(sec)) lista = lista.filter(m => !PERT_QUE_SAO_TRABALHO_NA_LOGISTICA.test(String(m||'')));
  return lista;
}

function renderArtigo(w){

function itemArtigo(a, programa){
  const uni=unidadeDoArtigo(a);
  const sub=[programa||'', uni?postoDaUnidade(uni):''].filter(Boolean).join(' · ');
  return el('button',{class:'item',onclick:()=>{ state.draft.artigo=a; state.draft.programa=programa; state.draft.unidade=uni; state.view='operacao'; render(); }},
    el('span',{class:'t'}, el('b',{},a), el('small',{}, sub)),
    el('span',{class:'chev'},'›'));
}
function fillArtigos(){
  const list=$('#artlist'); if(!list)return; list.innerHTML='';
  const f=(state._af||'').toLowerCase();
  const prog={}; state.cfg.artigos.forEach(a=>{ prog[a.artigo]=a.programa||''; });
  const base=[...(state.allowedArt||new Set(artigosAtivos()))].sort();

  // Com pesquisa: resultados planos (procura em todas as tipologias)
  if(f){
    const ativos=base.filter(a=>a.toLowerCase().includes(f)).slice(0,80);
    if(!ativos.length){ list.append(el('div',{class:'empty'},'Sem resultados.')); return; }
    for(const a of ativos) list.append(itemArtigo(a, prog[a]));
    return;
  }

  // Sem pesquisa, nível 1: botões por TIPOLOGIA (programa)
  if(!state._prog){
    const grupos={};
    base.forEach(a=>{ const p=prog[a]||'Outros'; (grupos[p]=grupos[p]||[]).push(a); });
    const nomes=Object.keys(grupos).sort();
    if(!nomes.length){ list.append(el('div',{class:'empty'},'Sem artigos.')); return; }
    for(const p of nomes){
      const n=grupos[p].length;
      list.append(el('button',{class:'item',onclick:()=>{ state._prog=p; fillArtigos(); }},
        el('span',{class:'t'}, el('b',{},p), el('small',{}, n+' artigo'+(n>1?'s':''))),
        el('span',{class:'chev'},'›')));
    }
    return;
  }

  // Nível 2: só os artigos da tipologia escolhida (+ voltar às tipologias)
  list.append(el('button',{class:'item',style:'opacity:.8',onclick:()=>{ state._prog=null; fillArtigos(); }},
    el('span',{class:'t'}, el('b',{},'‹ Tipologias')), el('span',{class:'chev'},'')));
  const doProg=base.filter(a=>(prog[a]||'Outros')===state._prog).sort();
  if(!doProg.length){ list.append(el('div',{class:'empty'},'Sem artigos nesta tipologia.')); return; }
  for(const a of doProg) list.append(itemArtigo(a, prog[a]));
}

function fillPlanos(){
  const list=$('#planlist'); if(!list)return; list.innerHTML='';
  const f=(state._pf||'').toLowerCase().trim();

    el('span',{class:'t'}, el('b',{},'‹ Tipologias')), el('span',{class:'chev'},'')));

  if(!doP.length){ list.append(el('div',{class:'empty'},'Sem planos nesta tipologia.')); return; }
  for(const p of doP) list.append(itemPlano(p));
}

/* ============ #3 STOCK MOTORISTAS (mapa por artigo + entradas/saídas) ============ */
LS.stockq='q_stock_queue'; LS.stockmap='q_stock_srv';
function loadStockQ(){ try{return JSON.parse(localStorage.getItem(LS.stockq)||'[]');}catch(e){return[];} }
function saveStockQ(q){ try{localStorage.setItem(LS.stockq,JSON.stringify(q));}catch(e){} }
async function syncStockQ(){ const url=(state.cfg&&state.cfg.urlStock)||null; let q=loadStockQ(); if(!q.length||!url)return; const resto=[]; for(const reg of q){ if(reg.ID&&jaEnviado(reg.ID))continue; let ok=false; try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(reg)});ok=r.ok;}catch(e){ok=false;} if(ok)marcarEnviado(reg.ID); else resto.push(reg);} saveStockQ(resto); }
async function loadStockMap(){ const url=(state.cfg&&state.cfg.urlStockLer)||null; if(!url)return; try{ const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}',cache:'no-store'}); if(r.ok){ let rows=await r.json(); if(!Array.isArray(rows))rows=(rows&&rows.value)||[]; localStorage.setItem(LS.stockmap,JSON.stringify(rows)); } }catch(e){} }
function computeStock(){ let srv=[]; try{ srv=JSON.parse(localStorage.getItem(LS.stockmap)||'[]'); }catch(e){}
  const rows=srv.concat(loadStockQ()); const last={};
  rows.forEach(r=>{ const art=(r.Artigo||r.artigo||''); const se=String(r.NumSerie||r.numSerie||'').trim(); const mv=(r.Movimento||r.movimento||''); if(!se)return; last[art+'|'+se]={art,se,mv}; });
  const map={}; Object.keys(last).forEach(k=>{ const x=last[k]; if(/entra/i.test(x.mv)){ (map[x.art]=map[x.art]||[]).push(x.se); } }); return map; }
function progDoArtigo(a){ const x=(state.cfg.artigos||[]).find(y=>y.artigo===a); return x?(x.programa||''):''; }
function renderStockMap(w){
  w.append(backbar('board','Stock — '+curto(state.op.nome)));
  w.append(el('div',{class:'cta',style:'position:static;padding:0 0 12px'},
    el('button',{class:'big ok',onclick:()=>{ state.smov={tipo:'Entra',artigo:null,programa:null,sel:[],stock:''}; state._af=''; state.view='stockmov'; render(); }},'➕  Entra em stock'),
    el('button',{class:'big warn',style:'margin-top:10px',onclick:()=>{ state.smov={tipo:'Sai',artigo:null,programa:null,sel:[],stock:''}; state._af=''; state.view='stockmov'; render(); }},'➖  Sai para ANN')));
  const map=computeStock(); const arts=Object.keys(map).sort();
  const nDe=(a)=> porQuantidade(progDoArtigo(a)) ? stockQtdArtigo(a) : map[a].length;
  const total=arts.reduce((s,a)=>s+nDe(a),0);
  w.append(el('p',{class:'lbl'}, 'Em stock agora — '+total+' caixa(s)'));
  if(!arts.length){ w.append(el('div',{class:'empty'},'Sem caixas em stock.')); }
  else { const list=el('div',{class:'list'});
    arts.forEach(a=>{ const n=nDe(a); if(n<=0) return; const qtd=porQuantidade(progDoArtigo(a)); const series=qtd?[]:map[a].slice().sort(); const open=state._sopen===a;
      list.append(el('button',{class:'item',onclick:()=>{ if(qtd)return; state._sopen= open?null:a; render(); }},
        el('span',{class:'t'}, el('b',{},a), el('small',{}, n+' em stock'+(!qtd&&open?(' · '+series.join(' · ')):''))),
        el('span',{class:'chev'}, qtd?'':(open?'▾':'▸')))); });
    w.append(list); }
  const nq=loadStockQ().length; if(nq) w.append(el('div',{class:'chip',style:'margin-top:10px'}, nq+' movimento(s) por sincronizar'));
}
// Caixas contadas por QUANTIDADE (sem nº de série): Praetor-caixas (Ailerons, Porta Carga/Rat, Spoilers) e Cxs sobras (Maquinação)
// (15-09-2026: o programa no catálogo é "Maquinaçao", com ç — o /maquinac/ não apanhava e as Cxs sobras
//  apareciam no Stock e no transporte como se tivessem um nº de série igual à quantidade)
function porQuantidade(prog){ return /praetor-caixas|maquina[cç]/i.test(prog||''); }
// Quantidade líquida em stock de um artigo por-quantidade (entradas − saídas)
function stockQtdArtigo(artigo){
  let srv=[]; try{ srv=JSON.parse(localStorage.getItem(LS.stockmap)||'[]'); }catch(e){}
  let net=0;
  srv.concat(loadStockQ()).forEach(r=>{ if((r.Artigo||r.artigo)!==artigo) return;
    const q=parseInt(String(r.NumSerie||r.numSerie||'').replace(/[^\d]/g,''))||0;
    net += /entra/i.test(r.Movimento||r.movimento||'') ? q : -q; });
  return Math.max(0,net);
}

function fillStockArt(){ const list=$('#stockartlist'); if(!list)return; list.innerHTML='';
  const f=(state._af||'').toLowerCase().trim(); const s=state.smov;
  let base=[...artigosAtivos()].sort();
  if(s.tipo==='Sai'){ base=Object.keys(computeStock()).sort(); }
  const r=(f?base.filter(a=>a.toLowerCase().includes(f)):base).slice(0,150);
  if(!r.length){ list.append(el('div',{class:'empty'},'Sem artigos.')); return; }
  r.forEach(a=>{ list.append(el('button',{class:'item',onclick:()=>{ s.artigo=a; s.programa=progDoArtigo(a); s.sel=[]; render(); }},
    el('span',{class:'t'}, el('b',{},a), el('small',{}, progDoArtigo(a))), el('span',{class:'chev'},'›'))); });
}
function confirmStock(){ const s=state.smov;
  // Caixa por QUANTIDADE → um movimento com NumSerie = nº de caixas
  if(porQuantidade(s.programa)){
    const qn=parseInt(String(s.qtd||'').replace(/[^\d]/g,''))||0;
    if(qn<=0){ toast('Indica a quantidade','err'); return; }
    if(s.tipo==='Sai'){ const atual=stockQtdArtigo(s.artigo); if(qn>atual){ toast('Só há '+atual+' em stock','err'); return; } }
    const dh=new Date().toLocaleString('pt-PT'); const dia=dstr(nowTs()); const q=loadStockQ();
    q.push({ ID:'STQ-'+(state.op.pin||'x')+'-'+nowTs()+'-'+s.artigo.replace(/\W/g,'').slice(0,12), Data:dia, Motorista:state.op.nome, Programa:s.programa||'', Artigo:s.artigo, NumSerie:String(qn), Movimento:s.tipo, Destino:(s.tipo==='Sai'?'ANN':''), DataHoraRegisto:dh });
    saveStockQ(q); syncStockQ();
    toast((s.tipo==='Sai'?'Saída':'Entrada')+' registada — '+qn+' caixa(s)','ok');
    state._sopen=s.artigo; state.smov=null; state.view='stockmap'; render(); return;
  }
  let series=[];
  if(s.tipo==='Sai'){ series=s.sel.slice(); if(!series.length){ toast('Escolhe pelo menos uma série','err'); return; } }
  else { series=parseSeries(s.stock); if(!series.length){ toast('Indica o nº de série','err'); return; } }
  const dh=new Date().toLocaleString('pt-PT'); const dia=dstr(nowTs()); const q=loadStockQ();
  series.forEach(serie=>{ q.push({ ID:'ST-'+(state.op.pin||'x')+'-'+nowTs()+'-'+serie, Data:dia, Motorista:state.op.nome, Programa:s.programa||'', Artigo:s.artigo, NumSerie:serie, Movimento:s.tipo, Destino:(s.tipo==='Sai'?'ANN':''), DataHoraRegisto:dh }); });
  saveStockQ(q); syncStockQ();
  toast((s.tipo==='Sai'?'Saída':'Entrada')+' registada — '+series.length+' série(s)','ok');
  state._sopen=s.artigo; state.smov=null; state.view='stockmap'; render();
}

/* ---- SÉRIES / MODO ---- */

      });
      w.append(list);
    }

function parseSeries(s){ return (s||'').split(/[\s,;\n]+/).map(x=>x.trim().toUpperCase()).filter(Boolean); }

// A MESMA GUARDA DO MODO ENCOMENDA, PARA O MODO STOCK
// No modo Encomenda as caixas entregues ou embaladas ficam fora da lista, e só entram com
// confirmação. No modo Stock o número de série escreve-se à mão e não havia verificação
// nenhuma: bastava escrever uma série já entregue e passava. Foi assim que a EM2408, entregue
// a 27/07, apanhou uma soldadura a 08/09.
function estadoDaSerie(serie){
  const s=String(serie||'').trim().toUpperCase();
  const e=(state.enc||[]).find(x=>String(x.serie||'').trim().toUpperCase()===s);
  return e?String(e.estado||'').trim().toLowerCase():'';
}
function serieFechadaPara(estado, operacao){
  const segundoCiclo=/tampa|embalamento final/i.test(operacao||'');
  if(segundoCiclo) return false;                    // 2º ciclo dos KC vem mesmo depois de tudo
  if(estado==='embalada') return true;              // embalada = terminada
  if(estado==='entregue') return !/embalamento|carga e transporte/i.test(operacao||'');
  return false;
}

function startJob(){
  const d=state.draft; let series=[];
  if(d.modo==='Encomenda'){ series=(d.sel||[]).slice(); if(!series.length){ toast('Seleciona pelo menos uma série','err'); return; } }
  else {
    series=parseSeries(d.stock);
    // BLOQUEIO, nao aviso. Uma caixa entregue ou embalada nao volta a receber esta operacao
    // por engano de digitacao. Se for retrabalho a serio, regista-se no Supervisor, onde fica
    // a saber-se quem o fez e porque.
    const fechadas=series.map(s=>({s, est:estadoDaSerie(s)})).filter(x=>serieFechadaPara(x.est, d.operacao));
    if(fechadas.length){
      alert('Não dá para registar esta operação nestas caixas:\n\n'+
            fechadas.map(x=>'   '+x.s+' — '+x.est).join('\n')+'\n\n'+
            'Depois de ENTREGUE só se regista embalamento ou transporte.\n'+
            'Depois de EMBALADA, mais nada.\n\n'+
            'Confirma o número de série. Se for mesmo retrabalho, tem de ser lançado no Supervisor.');
      return;
    }
    if(!series.length) series=['STOCK-'+Date.now().toString().slice(-6)];
  }
  const sig=d.operacao+'|'+series.slice().sort().join(',');
  const existing=state.jobs.find(j=>j.status!=='done' && (j.operacao+'|'+(j.series||[]).slice().sort().join(','))===sig);
  const worker={ op:state.op.nome, opCurto:curto(state.op.nome), pin:state.op.pin, startTs:nowTs(), pauses:[], status:'running', endTs:null };
  if(existing){
    if(existing.workers.some(x=>x.pin===state.op.pin && !x.endTs)){ toast('Já estás neste trabalho','err'); state.view='board'; render(); return; }
    existing.workers.push(worker); save(); pushTrabAberto(existing,'aberto'); toast('Juntaste-te à equipa ('+jobWorkersAtivos(existing).length+' operadores)','ok'); state.view='board'; render(); return;
  }
  const j={ id:'J'+Date.now(), artigo:d.artigo, programa:d.programa, operacao:d.operacao, unidade:d.unidade,
    modo:d.modo, series, plano:(planoDoArtigo(d.artigo)||{}).codigo||'', dia:dstr(nowTs()), status:'open', workers:[worker] };
  state.jobs.push(j); save(); pushTrabAberto(j,'aberto'); toast('Trabalho iniciado','ok'); state.view='board'; render();
}

/* ---- DETALHE / PAUSA / FIM ---- */
function openJob(id){ state.jobActionId=id; state.intent='jobaction'; state.op=null; state.pinbuf=''; state.view='pin'; render(); }
function curJob(){ return state.jobs.find(j=>j.id===state.curJob); }
function renderJob(w){
  const j=curJob(); if(!j){ state.view='board'; return render(); }
  if(j.transp) return renderTransp(w,j);   // transporte para a ANN tem ecrã próprio, por fases
  w.append(backbar('board', j.artigo));
  w.append(el('p',{class:'muted'}, j.operacao+' · '+postoDaUnidade(j.unidade)));
  const plJ=planoDoArtigo(j.artigo); if(plJ) w.append(planobar(plJ));
  w.append(gaugeEl(activeMs(j), objetivoMsJob(j)));
  w.append(el('div',{class:'planobar'},
    el('div',{class:'pi'}, '⏱ horas-homem ', el('b',{'data-jtimer':j.id}, fmtDur(activeMs(j)))),
    el('div',{class:'chip'}, (j.series.length)+' série(s)'+(j.modo==='Stock'?' · STOCK':''))));

  if(state.jobPhase==='fim'){
    w.append(el('p',{class:'lbl'},'Quantidade concluída (nesta operação)'));
    state._qty = state._qty || j.series.length || 1;
    const box=el('div',{class:'qtybox'});
    box.append(el('button',{onclick:()=>{state._qty=Math.max(0,state._qty-1);render();}},'−'));
    box.append(el('div',{class:'v'}, String(state._qty)));
    box.append(el('button',{onclick:()=>{state._qty=state._qty+1;render();}},'+'));
    w.append(box);
    w.append(el('button',{class:'big ok',style:'margin-top:8px',onclick:()=>finishJob(j)},'✅  Concluir operação'));
    return;
  }
  // equipa — só quem está no trabalho pode agir
  const myW = state.op ? j.workers.find(w=>w.pin===state.op.pin && !w.endTs) : null;
  const isWorker = state.op ? j.workers.some(w=>w.pin===state.op.pin) : false;
  w.append(el('div',{class:'chip',style:'margin-bottom:8px'}, 'A atuar: '+(state.op?curto(state.op.nome):'—')));
  w.append(el('p',{class:'lbl'},'Equipa neste trabalho'));
  const list=el('div',{class:'list'});
  jobWorkersAtivos(j).forEach(wk=>{
    const mine = myW && wk.pin===myW.pin;
    list.append(el('div',{class:'item',style:'align-items:center'+(mine?';border-color:var(--cy)':'')},
      el('span',{class:'t'}, el('b',{},wk.opCurto+(mine?' (tu)':'')), el('small',{}, 'a trabalhar · '+fmtHM(wActive(wk))))));
  });
  w.append(list);
  if(!isWorker){ w.append(el('div',{class:'flag'},'⛔ Não estás neste trabalho — só um operador registado nele o pode concluir. (Correções são para o supervisor.)')); return; }
  w.append(el('p',{class:'muted',style:'margin:14px 0 6px;font-size:12px'},'Toca em "Operação concluída" quando terminares esta operação. Para mudar de operação, conclui esta e entra na próxima.'));
  w.append(el('button',{class:'big ok',style:'margin-top:4px',onclick:()=>{state._qty=null;state.jobPhase='fim';render();}},'✅  Operação concluída (fecha o trabalho)'));
}
function pauseWorker(j,wk){ if(!wk){state.jobPhase='menu';return render();} wk.status='paused'; wk.pauseMotivo=state._rsn||'Paragem'; wk.pauses.push({start:nowTs(),motivo:wk.pauseMotivo}); state._rsn=null; state._pw=null; state.jobPhase='menu'; save(); toast('Em pausa','ok'); state.view='board'; render(); }
function resumeWorker(j,wk){ closeWorkerPause(wk); wk.status='running'; wk.pauseMotivo=null; save(); toast('Retomado','ok'); render(); }
function retomarDoOperador(op){
  // Retoma TODAS as sessoes em pausa deste operador (normalmente uma). Identidade pelo PIN.
  const meus=[];
  state.jobs.filter(j=>j.status!=='done').forEach(j=>{ (j.workers||[]).forEach(w=>{ if(String(w.pin)===String(op.pin) && !w.endTs && w.status==='paused') meus.push(w); }); });
  if(!meus.length){ toast('Não tens nenhum trabalho em pausa','err'); state.view='board'; return render(); }
  meus.forEach(w=>{ closeWorkerPause(w); w.status='running'; w.pauseMotivo=null; });
  save(); toast(meus.length>1?('Retomados '+meus.length+' trabalhos'):'Trabalho retomado','ok'); state.view='board'; render();
}
function guiado(j,opObj){ const sig=j.artigo+'|'+j.series.slice().sort().join(','); if(!state.cont||state.cont.sig!==sig){ state.cont={ sig, artigo:j.artigo, programa:j.programa, series:j.series.slice(), modo:j.modo, done:{} }; } state.cont.done[j.operacao]=true; state.lastOp=j.operacao; if(opObj&&opObj.nome) state.cont.op=opObj; }
function leaveWorker(j,wk){ if(wk.status==='paused')closeWorkerPause(wk); wk.endTs=nowTs(); wk.status='parado'; enqueueRegisto(j,wk,false);
  save(); toast(wk.opCurto+' — sessão registada. A operação continua aberta.','ok'); state.view='board'; render(); }
function finishJob(j){
  // concluir SÓ a parte do operador atual (equipa: cada um conclui a sua)
  const myW = state.op ? j.workers.find(w=>w.pin===state.op.pin && !w.endTs) : null;
  if(!myW){ toast('Só um operador ativo deste trabalho a pode concluir','err'); state.view='board'; render(); return; }
  if(myW.status==='paused') closeWorkerPause(myW);
  myW.endTs=nowTs(); myW.status='done';
  const restamAtivos = j.workers.some(w=>!w.endTs);   // ainda há colegas nesta operação?
  const opConcluida = !restamAtivos;                    // a operação (e a caixa) só conclui no ÚLTIMO
  if(opConcluida){ j.qty=state._qty; state._qty=null; j.terminadoPor=state.op?state.op.nome:''; }
  enqueueRegisto(j, myW, true);                          // regista o meu tempo (a caixa nunca é concluída aqui)
  if(opConcluida){
    j.status='done'; guiado(j,{nome:(state.op?state.op.nome:''),pin:(state.op?state.op.pin:'')});
    save(); pushTrabAberto(j,'fechado'); toast('Operação concluída e guardada','ok'); state.jobPhase='menu'; state.view='proxima'; render();
  } else {
    const faltam = j.workers.filter(w=>!w.endTs).length;
    save(); toast('A tua parte foi concluída. Falta(m) '+faltam+' colega(s) nesta operação.','ok'); state.jobPhase='menu'; state.view='board'; render();
  }
}
function startContinuar(o){ const c=state.cont;
  const opObj = state.op ? {nome:state.op.nome,pin:state.op.pin} : (c.op||null);
  if(!opObj||!opObj.nome){ toast('Identifica-te para continuar','err'); return; }
  const worker={ op:opObj.nome, opCurto:curto(opObj.nome), pin:opObj.pin||'', startTs:nowTs(), pauses:[], status:'running', endTs:null };
  const j={ id:'J'+Date.now(), artigo:c.artigo, programa:c.programa, operacao:o.operacao, unidade:o.unidade, modo:c.modo,
    series:c.series.slice(), plano:(planoDoArtigo(c.artigo)||{}).codigo||'', dia:dstr(nowTs()), status:'open', workers:[worker] };
  state.jobs.push(j); save(); pushTrabAberto(j,'aberto'); toast('Operação seguinte iniciada','ok'); state.view='board'; render(); }
function renderProxima(w){ const c=state.cont; if(!c){ state.view='board'; return renderBoard(w); }
  w.append(el('div',{class:'backbar'}, el('button',{class:'back',onclick:()=>{state.cont=null;state.view='board';render();}},'‹ Ao quadro')));
  w.append(el('h2',{},'✓ '+(state.lastOp||'Operação')+' — terminada'));
  w.append(el('p',{class:'muted'}, c.artigo+' · '+c.series.length+' série(s)'));
  const rest=operacoesDoArtigo(c.artigo).filter(o=>(!state.area||state.area.includes(o.unidade)) && !c.done[o.operacao]);
  if(!rest.length){ w.append(el('div',{class:'flag',style:'border-color:#1c4a3c;background:var(--rundim);color:var(--run)'},'✓ Todas as operações da tua área para estas séries estão feitas.'));
    w.append(el('button',{class:'big',style:'margin-top:12px',onclick:()=>{state.cont=null;state.view='board';render();}},'Voltar ao quadro')); return; }
  w.append(el('p',{class:'lbl'},'Próxima operação — para AS MESMAS séries'));
  const list=el('div',{class:'list'});
  rest.forEach(o=>{ const obj=objetivoOperacao(o.operacao, state.cont&&state.cont.artigo);
    list.append(el('button',{class:'item',onclick:()=>startContinuar(o)},
      el('span',{class:'t'}, el('b',{},o.operacao), el('small',{}, postoDaUnidade(o.unidade)+(obj?(' · objetivo '+obj):''))),
      el('span',{class:'chev'},'▶'))); });
  w.append(list);
  w.append(el('button',{class:'big ghost',style:'margin-top:12px',onclick:()=>{state.cont=null;state.view='board';render();}},'Terminei — voltar ao quadro')); }

/* ---- gravar registo (fila local -> sync) ---- */
/* ---- REDE DE SEGURANÇA: nenhuma sessão fecha sem registo (16-09-2026) ----
   A Sónia: "o hugo picão fez registos e aparece vazio". Ele trabalhou os dias 14 e 15 de
   setembro e no Supervisor não havia uma única linha dele. Havia caminhos que davam a
   sessão do operador por terminada SEM escrever registo nenhum — o fecho à distância
   (reconcileTrabAbertos), o fecho de trabalhos antigos, e provavelmente outros que ainda
   não conhecemos. O tempo desaparecia em silêncio.
   Regra nova: quem teve sessão, tem registo. O que for fechado automaticamente vai
   marcado nos Comentários, para ela confirmar as horas em vez de as perder. */
var MARCA_AUTO = 'FECHO AUTOMÁTICO — confirmar as horas';
function marcoRegistos(){            // a partir de que momento é que esta rede vigia
  try{ var m = localStorage.getItem('q_marco_registos');
       if(!m){ m = String(nowTs()); localStorage.setItem('q_marco_registos', m); }
       return Number(m) || 0; }catch(e){ return 0; }
}
function registarSessao(j, w, motivo){
  var ant = j.comentario;
  if(motivo) j.comentario = (ant ? (ant + ' · ') : '') + motivo;
  try{ enqueueRegisto(j, w, false); } finally { j.comentario = ant; }
}
// Fecha as sessões ainda abertas de um trabalho E garante que todas ficam registadas.
// A hora de fim nunca passa do fim do turno em que a sessão começou: um trabalho
// esquecido de ontem não pode dar trinta horas.
function fecharSessoesComRegisto(j, motivo){
  var n = 0, desde = marcoRegistos();
  (j.workers||[]).forEach(function(w){
    if(!w.endTs){
      if(w.status==='paused'){ try{ closeWorkerPause(w); }catch(e){} }
      w.endTs = Math.min(nowTs(), limiteTurno(w.startTs));
      w.status = 'parado';
    }
    if(w._reg || w.endTs < desde){ w._reg = true; return; }   // já registado (ou de antes desta versão)
    registarSessao(j, w, motivo || MARCA_AUTO); n++;
  });
  return n;
}
// Varre o que ficou por registar, venha de onde vier — inclusive de caminhos que ainda
// não conhecemos. Só olha para sessões terminadas DEPOIS de esta versão entrar: as
// antigas já foram enviadas e não se reescrevem.
function varrerRegistosEmFalta(){
  var desde = marcoRegistos(), n = 0;
  (state.jobs||[]).forEach(function(j){
    (j.workers||[]).forEach(function(w){
      if(!w.endTs || w._reg) return;
      if(w.endTs < desde){ w._reg = true; return; }
      if(nowTs() - w.endTs < 120000) return;      // dois minutos de folga ao caminho normal
      registarSessao(j, w, MARCA_AUTO); n++;
    });
  });
  if(n) save();
  return n;
}
setInterval(varrerRegistosEmFalta, 120000);
// Os pins vão para a folha como "6522,7997,2040" e voltam de lá "652279972040" — a folha
// come as vírgulas. Todos os pins têm 4 dígitos, por isso corta-se de 4 em 4. Sem isto
// NENHUM trabalho de equipa era recuperado: ficava sem operadores reconhecidos.
function pinsDaLinha(s){
  var l = String(s||'').split(',').map(function(x){ return x.trim(); }).filter(Boolean);
  if(l.length===1 && /^\d{8,}$/.test(l[0]) && l[0].length % 4 === 0){
    var t = l[0]; l = []; for(var i=0; i<t.length; i+=4) l.push(t.substr(i,4));
  }
  return l;
}
function ehEmbalamento(j){ return /embalamento/i.test(j.unidade||'') || /embalamento/i.test(j.operacao||''); }
function enqueueRegisto(j,wk,concluida){
  // Um registo POR SÉRIE. O quiosque SÓ regista tempos — NUNCA conclui a caixa.
  // A caixa é concluída/produzida por TI na Gestão de Encomendas (ao pôr em stock).
  const caixaConcl = 'Nao';
  const series = (j.series && j.series.length) ? j.series : [''];
  const durMs = Math.round(wActive(wk)/series.length);      // tempo repartido pelas séries do lote
  const pauMs = Math.round(wPaused(wk)/series.length);
  const dh = new Date().toLocaleString('pt-PT');
  const q=loadQueue();
  series.forEach(serie=>{
    const _id = j.id+'-'+(wk.pin||'x')+'-'+wk.startTs+'-'+serie;
    if(jaEnviado(_id) || q.some(x=>x.ID===_id)) return; // anti-duplicado: mesmo ID ja enviado ou ja na fila
    q.push({ ID:_id, Data:j.dia, Artigo:j.artigo, Programa:(j.programa||programaDoArtigo(j.artigo)), Operacao:j.operacao,
      UnidadeProducao:(j.unidade||unidadeDaOp(j.operacao,j.artigo)), Posto:postoDaUnidade(j.unidade||unidadeDaOp(j.operacao,j.artigo)), Colaborador:wk.op, Modo:j.modo,
      NumSerie:serie, HoraInicio:hhmm(wk.startTs), HoraFim:hhmm(wk.endTs||nowTs()),
      PausasMin:Math.round(pauMs/60000).toString(), Duracao:Math.round(durMs/60000).toString(),
      Quantidade:'1', Plano:j.plano, Comentarios:(state.cfg&&state.cfg.modoTeste?'TESTE':(j.comentario||'')), CaixaConcluida:caixaConcl, OperacaoConcluida:(concluida?'Sim':'Nao'),
      Equipa:String((j.workers||[]).length), ConcluidoPor:(concluida?(j.terminadoPor||wk.op):''), DataHoraRegisto:dh });
  });

}
var _syncing=false;
async function syncQueue(){
  if(_syncing) return;                       // tranca: nunca dois envios em simultaneo (evitava duplicados)
  const url=(state.cfg && state.cfg.urlProducao)||null; // definido depois (fluxo Power Automate)
  let q=loadQueue(); if(!q.length)return;
  if(!url) return; // sem fluxo definido: fica em fila local (v0.1)
  _syncing=true;
  const resto=[]; const vistos={};
  try{
    for(const reg of q){
      if(reg.ID && (jaEnviado(reg.ID) || vistos[reg.ID])) continue; // ja enviado / repetido na fila -> descarta
      if(reg.ID) vistos[reg.ID]=1;
      let ok=false;
      try{ const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(reg)}); ok=r.ok; }catch(e){ ok=false; }
      if(ok){ marcarEnviado(reg.ID); } else { resto.push(reg); }
    }
  } finally { _syncing=false; }

}
var _syncingP=false;
async function syncPertQueue(){
  // Tranca + memoria do que ja foi enviado — o mesmo que o syncQueue dos registos ja
  // tinha e este nao. Sem isso, a paragem era enviada DUAS vezes: o enqueuePerturbacao
  // chama esta funcao logo, e o temporizador dos 30s podia entrar ao mesmo tempo; as duas
  // liam a mesma fila e as duas faziam o POST. Aconteceu a 04-09 com a "Formacao on the
  // Job" do W. Inaba — a mesma linha, com o MESMO IDRegisto, ficou duplicada na nuvem.
  if(_syncingP) return;
  const url=(state.cfg && state.cfg.urlPerturbacoes)||null;
  let q=loadPertQ(); if(!q.length)return;
  if(!url) return; // sem fluxo definido: fica em fila local
  _syncingP=true;
  const resto=[]; const vistos={};
  try{
    for(const reg of q){
      const id=reg.IDRegisto;
      if(id && (jaEnviado(id) || vistos[id])) continue;   // ja foi / repetido na fila
      if(id) vistos[id]=1;
      let ok=false;

setInterval(()=>{ try{ syncQueue(); syncPertQueue(); syncStockQ(); }catch(e){} }, 30000); // reenvia as filas automaticamente (quando a rede volta)

/* ---- UMA JANELA POR POSTO ---------------------------------------------------

   em memoria. Batem as duas (enchem a tabela dos batimentos ao dobro e enganam o Painel),
   e a esquecida escreve paragens fantasma no fecho do dia. Aconteceu tres vezes numa semana.

   Regra: manda a ULTIMA janela aberta. A anterior fica de lado — deixa de bater, de
   sincronizar e de fechar o dia — e mostra porque. Bloquear a NOVA seria pior: quando uma
   janela encrava, o instinto e abrir outra, e ficava-se sem nenhuma. Fica um botao para
   retomar esta, caso tenha sido engano.

   Nao fecha a janela sozinha porque o browser nao deixa: window.close() so funciona em
   janelas abertas por script. O que se garante e que uma janela de lado nao escreve nada.  */
const JANELA_ID = 'W' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
const K_JANELA  = 'q_janela_ativa';
var _deLado = false;
function reclamarJanela(){ try{ localStorage.setItem(K_JANELA, JSON.stringify({id:JANELA_ID, ts:Date.now()})); }catch(e){} }
function donoDaJanela(){ try{ return JSON.parse(localStorage.getItem(K_JANELA)||'null'); }catch(e){ return null; } }
function porJanelaDeLado(){
  if(_deLado || document.getElementById('janela-de-lado')) return;
  _deLado = true;
  const ov=document.createElement('div'); ov.id='janela-de-lado';
  ov.style.cssText='position:fixed;inset:0;z-index:99999;background:#0b1116;color:#cfe3ee;display:flex;'+
    'align-items:center;justify-content:center;text-align:center;font-family:system-ui;padding:24px';

setInterval(vigiarJanela, 3000);
window.addEventListener('storage', function(e){ if(e.key===K_JANELA) vigiarJanela(); });

/* ---- batimento para o painel ao vivo (andon). Inofensivo ate urlAtivos existir. ---- */
function buildAtivos(){
  const out=[];
  (state.jobs||[]).forEach(j=>{ (j.workers||[]).forEach(w=>{ if(w.endTs) return;
    out.push({ opCurto:w.opCurto||curto(w.op||''), operacao:j.operacao||'', artigo:j.artigo||'',
      serie:(j.series&&j.series.length)?j.series.join(' · '):'', inicioHHMM:hhmm(w.startTs),
      desdeMin:Math.floor(wActive(w)/60000), estado:(w.status==='paused'?'pausa':'trabalhar') }); }); });
  (state.perts||[]).forEach(p=>{ out.push({ opCurto:p.opCurto||curto(p.op||''),
    operacao:'PARAGEM: '+(p.motivo||''), artigo:'', serie:'', inicioHHMM:hhmm(p.startTs),
    desdeMin:Math.floor((nowTs()-p.startTs)/60000), estado:'pausa' }); });
  return out;
}
// "Sem nome" NAO e um nome. Um aparelho ficou com isso gravado e passou dias a
// escrever na tabela dos trabalhos abertos sem que ninguem soubesse qual era.
// Aqui trata-se como se nao tivesse nome nenhum, para voltar a perguntar.
function nomeInvalido(n){ return !n || !String(n).trim() || /^sem nome$/i.test(String(n).trim()); }
function nomeGuardado(){ const n=localStorage.getItem('q_dispositivo'); return nomeInvalido(n)?null:n; }

// garante que o aparelho TEM nome (do ?d= ou perguntando 1x)
function ensureDeviceName(){
  try{ const p=new URLSearchParams(location.search).get('d'); if(p&&p.trim()){ localStorage.setItem('q_dispositivo',p.trim()); return; } }catch(e){}
  if(nomeGuardado()) return;
  let n=null; try{ n=prompt('Qual é o nome deste aparelho?\n(ex.: Tablet-Montagem, Zebra, Telemovel-Soldadura)',''); }catch(e){}

}
function deviceName(){

  // Sem nome escolhido, cada aparelho fica com um proprio: com "Sem nome" para todos,
  // varios aparelhos partilhavam a mesma identidade no Painel.

}
async function enviarBatimento(){
  if(_deLado) return;   // janela de lado: nao bate, para nao enganar o Painel
  const url=(state.cfg && state.cfg.urlAtivos)||null; if(!url) return; // sem fluxo definido -> nao envia

var _hbT=null;
function agendarBatimento(){ clearTimeout(_hbT); _hbT=setTimeout(enviarBatimento,1500); }
// Batimento de minuto a minuto, nao de 20 em 20 segundos.
// Cada batimento e uma linha na tabela Ativos.xlsx, e o fluxo que o Painel le so
// devolve as ultimas 256 — a 3 linhas por minuto isso eram 28 minutos de historico,
// e o Painel tolera 25 de silencio. Faltavam tres minutos para os aparelhos que
// adormecem comecarem a desaparecer do Painel sem razao.
// Nao se perde reactividade: qualquer mudanca dispara um batimento imediato
// (agendarBatimento, 1,5 s) — isto e so o sinal de vida.

/* ---- Trabalhos abertos -> nuvem (Painel persistente + encerrar entre aparelhos) ---- */

// Um trabalho FECHADO fica fechado.
// Antes valia "a última linha da tabela ganha": bastava o reenvio automático chegar
// depois do "Encerrar" do Supervisor para o trabalho voltar a abrir — e voltava
// sempre, porque o reenvio repetia-se de minuto a minuto.
function trabFechados(){ try{ return JSON.parse(localStorage.getItem('q_trab_fechados')||'[]'); }catch(e){ return []; } }
function jaFechado(id){ return trabFechados().indexOf(String(id))!==-1; }
function marcarTrabFechado(id){ try{ const s=trabFechados(); if(s.indexOf(String(id))===-1){ s.push(String(id)); localStorage.setItem('q_trab_fechados', JSON.stringify(s.slice(-400))); } }catch(e){} }

// Fechos que não chegaram à nuvem (sem rede) — ficam em fila e voltam a ser tentados.
function filaFechos(){ try{ return JSON.parse(localStorage.getItem('q_trab_fila_fecho')||'[]'); }catch(e){ return []; } }
function guardarFilaFechos(a){ try{ localStorage.setItem('q_trab_fila_fecho', JSON.stringify(a.slice(-200))); }catch(e){} }

// Só se escreve quando alguma coisa muda de facto. O reenvio de minuto a minuto
// enchia a tabela (um aparelho escreveu 2241 linhas em dois dias) e empurrava-a
// para lá das linhas que o fluxo de leitura consegue devolver — a partir daí
// ninguém mais via os fechos e os trabalhos reapareciam para sempre.
var _trabSig = {};
function trabAssinatura(j, estado){
  return [estado, j.dia||'', j.artigo||'', j.operacao||'', (j.series||[]).join('·'),
          (j.workers||[]).map(w=>(w.opCurto||'')+':'+(w.endTs?'fim':(w.status||''))).join(',')].join('|');
}
function trabRec(j, estado){
  const nomes=[...new Set((j.workers||[]).map(w=>w.opCurto||curto(w.op||'')).filter(Boolean))].join(', ');
  const pins=[...new Set((j.workers||[]).map(w=>String(w.pin||'')).filter(Boolean))].join(',');
  return { ID:deviceName()+'|'+j.id, Dispositivo:deviceName(), JobID:String(j.id), Data:j.dia||dstr(nowTs()),
    Programa:j.programa||'', Artigo:j.artigo||'', Operacao:j.operacao||'', Unidade:j.unidade||'',
    Series:(j.modo==='Stock'?'STOCK · ':'')+(j.series||[]).join(' · '),   // o modo não tem coluna própria; vai no prefixo
    Operadores:nomes, Pins:pins, Estado:estado, DataHoraRegisto:new Date().toLocaleString('pt-PT') };
}
async function pushTrabAberto(j, estado, forcar){
  const url=(state.cfg && state.cfg.urlTrabAbertos)||null; if(!url||!j) return;
  const id=deviceName()+'|'+j.id;
  if(estado!=='fechado' && jaFechado(id)) return;          // fechado não volta a abrir
  const sig=trabAssinatura(j,estado);
  if(!forcar && estado!=='fechado' && _trabSig[id]===sig) return;   // nada mudou → não escreve
  const rec=trabRec(j,estado);
  let ok=false;
  try{ const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)}); ok=r.ok; }catch(e){}
  if(ok){ _trabSig[id]=sig; if(estado==='fechado') marcarTrabFechado(id); }
  else if(estado==='fechado'){ const f=filaFechos(); if(!f.some(x=>x.ID===rec.ID)){ f.push(rec); guardarFilaFechos(f); } }
}
async function reenviarFechos(){
  const url=(state.cfg && state.cfg.urlTrabAbertos)||null; const fila=filaFechos(); if(!url||!fila.length) return;
  const enviados=[];
  for(const rec of fila){ let ok=false;
    try{ const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)}); ok=r.ok; }catch(e){}
    if(ok){ marcarTrabFechado(rec.ID); enviados.push(String(rec.ID)); } }
  if(enviados.length){ guardarFilaFechos(filaFechos().filter(x=>enviados.indexOf(String(x.ID))===-1)); }  // reler: pode ter entrado outro entretanto
}
function syncTrabAbertos(){ if(_deLado) return; reenviarFechos(); (state.jobs||[]).forEach(j=>{ if(j.status!=='done') pushTrabAberto(j,'aberto'); }); }

// A data chega da folha como número de série do Excel.
function trabDataISO(v){ const s=String(v==null?'':v).trim();
  if(/^\d+(\.\d+)?$/.test(s)){ const d=new Date(Math.round((parseFloat(s)-25569)*86400000)); return isNaN(d.getTime())?'':d.toISOString().slice(0,10); }
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0];
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);
  return ''; }
function trabTs(s){ const m=String(s||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4}),?\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(!m) return null; const d=new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5],+(m[6]||0)); return isNaN(d.getTime())?null:d.getTime(); }

// RECUPERAR os trabalhos que este aparelho perdeu.
// Os trabalhos em curso só viviam no armazenamento do browser: se o aparelho vai
// abaixo, ou o browser limpa os dados do site, desaparecem. A nuvem tem-nos — e a
// primeira linha de cada trabalho diz a hora a que começou, por isso o cronómetro
// também se recupera. Só se recuperam os de HOJE, para não ressuscitar velharias.
function recuperarTrabAbertos(rows){
  if(!rows || !rows.length || !state.cfg) return 0;
  const eu=deviceName(), hoje=dstr(nowTs());
  const porId={};
  rows.forEach(x=>{ const id=String(x.ID||''); if(!id) return;
    if(!porId[id]) porId[id]={prim:x, ult:x, fechado:false};
    porId[id].ult=x; if(/^fechad|^fechar/.test(String(x.Estado||''))) porId[id].fechado=true; });
  let n=0;
  for(const id in porId){ const g=porId[id], x=g.ult;
    if(g.fechado || jaFechado(id)) continue;
    if(String(x.Dispositivo||'')!==eu) continue;
    const dia=trabDataISO(x.Data); if(dia!==hoje) continue;
    const jid=String(x.JobID||''); if(!jid) continue;
    if((state.jobs||[]).some(j=>String(j.id)===jid)) continue;      // já cá está
    const ts=trabTs(g.prim.DataHoraRegisto)||nowTs();
    const workers=pinsDaLinha(x.Pins).map(p=>{
      const o=(state.cfg.operadores||[]).find(y=>String(y.pin)===p);
      return o?{op:o.nome, opCurto:curto(o.nome), pin:p, startTs:ts, pauses:[], status:'running', endTs:null}:null;
    }).filter(Boolean);
    if(!workers.length) continue;                                   // sem operador reconhecido não vale a pena
    let ser=String(x.Series||''); const ehStock=/^STOCK · /.test(ser); if(ehStock) ser=ser.replace(/^STOCK · /,'');
    const series=ser.split(' · ').map(s=>s.trim()).filter(Boolean);
    const j={ id:jid, artigo:x.Artigo||'', programa:(x.Programa||programaDoArtigo(x.Artigo||'')), operacao:x.Operacao||'',
      unidade:(x.Unidade||unidadeDaOp(x.Operacao||'', x.Artigo||'')),
      modo:(ehStock?'Stock':'Encomenda'), series, plano:(planoDoArtigo(x.Artigo||'')||{}).codigo||'',
      dia, status:'open', workers };
    state.jobs.push(j); _trabSig[id]=trabAssinatura(j,'aberto');    // não reescrever já o que acabámos de ler
    n++;
  }
  if(n){ save(); if(state.view==='board') render(); toast(n+(n===1?' trabalho recuperado':' trabalhos recuperados'),'ok'); }
  return n;
}

// Uma leitura de cada vez. Estavamos a pedir de 30 em 30 segundos; quando o fluxo
// demorava mais do que isso, os pedidos acumulavam-se e entupiam-no de vez.
var _recAndar = false;
async function reconcileTrabAbertos(){
  if(_deLado) return;   // janela de lado: nao recupera trabalhos para um estado que ja nao manda
  const url=(state.cfg && state.cfg.urlTrabAbertosLer)||null; if(!url) return;
  if(_recAndar) return;
  _recAndar = true;
  try{ const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}',cache:'no-store'}); const jj=await r.json(); const rows=jj.value||jj.linhas||(Array.isArray(jj)?jj:[]);
    // BASTA UMA linha "fechado" para o trabalho estar fechado — ver a nota lá em cima.
    const fechados={}; rows.forEach(x=>{ if(!x.ID) return; const e=String(x.Estado||''); if(e==='fechado'||e==='fechar') fechados[String(x.ID)]=true; });
    let mudou=false;
    (state.jobs||[]).forEach(j=>{ if(j.status==='done') return; const id=deviceName()+'|'+j.id;
      if(fechados[id]){ fecharSessoesComRegisto(j, 'FECHO À DISTÂNCIA'); j.status='done'; marcarTrabFechado(id); mudou=true; } });
    if(mudou){ save(); if(state.view==='board') render(); }
    recuperarTrabAbertos(rows);
  }catch(e){}
  finally{ _recAndar = false; }
}

/* ============================================================
   TRANSPORTE PARA A ANN (15-09-2026)
   A ANN queixa-se da qualidade das caixas, mas não verifica nada quando as recebe — e por
   vezes são eles que as danificam. E às vezes o camião fica horas à espera de descarga.
   Pedido da Sónia: tudo dentro do quiosque, no tablet do camião:
     1. inicia o transporte e escolhe as caixas (o "Sai para ANN" do stock fica registado)
     2. faz a guia de transporte no Portal das Finanças — obrigatória ANTES de partir
     3. viagem → 4. chega à portaria (o relógio continua) → 5. descarga: 3 fotos por caixa
        (caixas por quantidade: 3 fotos por lote), sem danos / com dano, checklist
     6. quem recebe na ANN confirma a receção e a conformidade e assina → relatório por email
   A espera (portaria → início da descarga) fica registada como a paragem "Tempo espera no
   cliente…" (perda, Esperas) e SAI do tempo do trabalho — não estraga a performance do
   transporte (objetivo 30 min). No ecrã o relógio conta sempre o tempo total.
   Fotos e assinaturas vão para o IndexedDB (o localStorage não aguenta imagens). O relatório
   segue pelo fluxo "Enviar Relatorio QC" (o mesmo do QC) e, sem rede, fica em fila no tablet.
   ============================================================ */
const TR_PORTAL = 'https://www.acesso.gov.pt/jsp/loginRedirectForm.jsp?path=DocTransporte%2FpainelRemetente.action&partID=SGDT';
// A pagina do formulario, para a abrir ja com os dados no endereco. Se a sessao tiver

const TR_PORTAL_GUIA = 'https://faturas.portaldasfinancas.gov.pt/DocTransporte/emitirDocTranspForm.action';
const TR_URL_ENVIAR = 'https://defaultcade90c14fe343a3860494c20418f8.fb.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/09/workflows/633e49a3b93f41898c5c07626b3d1db6/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=67yNit8mamYQYVo_aRPAWOwgSGGfIH1NA0PDqX0I74w';
const TR_EMAIL_EMBARESA = ['ssantos@embaresa.com'];
const TR_FASES = [ {k:'carga',t:'Carga'}, {k:'guia',t:'Guia'}, {k:'viagem',t:'Viagem'}, {k:'portaria',t:'Portaria'}, {k:'descarga',t:'Descarga'}, {k:'rececao',t:'Receção'} ];
const TR_FOTOS_CAIXA = [ {k:'canto1',t:'Canto',dica:'Afasta-te: duas faces e o topo da caixa.'}, {k:'canto2',t:'Canto oposto',dica:'Do lado contrário: as outras duas faces.'}, {k:'etiqueta',t:'Etiqueta / nº série',dica:'Perto, com o nº de série legível.'} ];
const TR_FOTOS_LOTE  = [ {k:'vista1',t:'Lote — lado 1',dica:'O lote todo, de um canto.'}, {k:'vista2',t:'Lote — lado 2',dica:'O lote todo, do canto oposto.'}, {k:'contagem',t:'Contagem / etiqueta',dica:'Que se veja quantas caixas são.'} ];
const TR_CHECK = [ {k:'descarga',t:'As caixas foram descarregadas sem quedas nem choques'}, {k:'secas',t:'As caixas estão secas e limpas'}, {k:'etiquetas',t:'As etiquetas e os nºs de série estão legíveis'}, {k:'fechos',t:'Fechos, cintas e tampas estão em bom estado'} ];

function trEscape(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function trNorm(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim(); }
function trEmailOk(e){ return /^[^\s@;,<>]+@[^\s@;,<>]+\.[a-z]{2,}$/i.test(String(e||'').trim()); }
function trFase(j){ return (j && j.transp && j.transp.fase) || 'carga'; }
function trFaseNome(j){ const f=TR_FASES.find(x=>x.k===trFase(j)); return f?f.t:''; }
function trTotalMs(j){ const t=j.transp; return Math.max(0,(t.ts.fim||nowTs())-t.ts.inicio); }
function trEsperaMs(j){ const t=j.transp; if(!t.ts.chegada) return 0; return Math.max(0,(t.ts.descarga||t.ts.fim||nowTs())-t.ts.chegada); }
function trNCaixas(j){ return (j.transp.caixas||[]).reduce((s,c)=>s+(c.tipo==='lote'?(c.qtd||0):1),0); }
function trSlots(c){ return c.tipo==='lote'?TR_FOTOS_LOTE:TR_FOTOS_CAIXA; }
function trNomeCx(c){ return c.tipo==='lote' ? (c.artigo+' — '+c.qtd+' caixa(s)') : (c.artigo+' — série '+c.serie); }
function trCxCompleta(c){ return trSlots(c).every(s=>c.fotos&&c.fotos[s.k]) && !!c.estado && (c.estado!=='dano' || (String(c.danoDesc||'').trim() && (c.danos||[]).length>0)); }
function trOperacao(){ const ops=(state.cfg&&state.cfg.operacoes)||[]; return ops.find(o=>/transporte/i.test(o.programa||'')&&/carga e transporte/i.test(o.operacao||'')) || ops.find(o=>/transporte/i.test(o.programa||'')) || null; }
function trTipoEspera(){ const l=(state.cfg&&state.cfg.perturbacoes)||[]; return l.find(m=>/tempo espera no cliente/i.test(m)) || 'Tempo espera no cliente-Recepçao /Caixa/ Peça/Qualidade'; }
function trHM(ms){ const m=Math.round((ms||0)/60000); const h=Math.floor(m/60); return h>0?(h+' h '+two(m%60)+' min'):(m+' min'); }
function trMeuWorker(j){ return state.op ? (j.workers||[]).find(w=>String(w.pin)===String(state.op.pin) && !w.endTs) : null; }
function trUid(){ return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function trNovaCaixa(o){ return Object.assign({ uid:trUid(), estado:'', danoDesc:'', fotos:{}, danos:[] }, o); }

/* ---- IndexedDB: fotos (media), miniaturas e assinaturas (mini), relatórios por enviar (fila) ---- */
let _trDb=null;
function trDb(){ if(_trDb) return Promise.resolve(_trDb); return new Promise((res,rej)=>{ const r=indexedDB.open('QuiosqueTransportes',1);
  r.onupgradeneeded=e=>{ const d=e.target.result; ['media','mini'].forEach(s=>{ if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:'k'}); }); if(!d.objectStoreNames.contains('fila')) d.createObjectStore('fila',{keyPath:'id'}); };
  r.onsuccess=e=>{ _trDb=e.target.result; res(_trDb); }; r.onerror=e=>rej(e.target.error); }); }
async function trIdb(store, modo, fn){ const d=await trDb(); return new Promise((res,rej)=>{ const tx=d.transaction(store,modo); const rq=fn(tx.objectStore(store)); tx.oncomplete=()=>res(rq?rq.result:undefined); tx.onerror=e=>rej(e.target.error); tx.onabort=e=>rej(e.target.error); }); }
const trPut=(st,o)=>trIdb(st,'readwrite',os=>os.put(o));
const trGet=(st,k)=>trIdb(st,'readonly',os=>os.get(k));
const trAll=(st)=>trIdb(st,'readonly',os=>os.getAll());
const trDel=(st,k)=>trIdb(st,'readwrite',os=>os.delete(k));
const _trThumb={}, _trSig={};
let _trMediaDe=null;
async function trCarregarMedia(j){
  if(_trMediaDe===j.id) return; _trMediaDe=j.id;
  try{ (await trAll('mini')).forEach(m=>{ if(String(m.k).indexOf(j.id+'|')!==0) return; if(m.sig) _trSig[m.k]=m.sig; else if(m.thumb) _trThumb[m.k]=m.thumb; }); }catch(e){}
  if(state.view==='job') render();
}
async function trApagarMedia(jobId){
  for(const st of ['media','mini']){ try{ const ks=await trIdb(st,'readonly',os=>os.getAllKeys()); for(const k of ks){ if(String(k).indexOf(jobId+'|')===0) await trDel(st,k); } }catch(e){} }
  Object.keys(_trThumb).forEach(k=>{ if(k.indexOf(jobId+'|')===0) delete _trThumb[k]; });
  Object.keys(_trSig).forEach(k=>{ if(k.indexOf(jobId+'|')===0) delete _trSig[k]; });
}
// fotos de transportes que já não estão abertos (ex.: fechados às 23:59 sem relatório) — guardam-se 3 dias
async function trLimparOrfas(){
  try{ const vivos=new Set((state.jobs||[]).filter(j=>j.transp&&j.status!=='done').map(j=>j.id)); const limite=Date.now()-3*86400000;
    for(const st of ['media','mini']){ for(const m of await trAll(st)){ const jid=String(m.k).split('|')[0]; if(!vivos.has(jid) && (m.ts||0)<limite) await trDel(st,m.k); } } }catch(e){}
}

/* ---- começar / cancelar ---- */
function trNovo(){
  const op=state.op;
  if(!/transp/i.test((op.seccao||'')+' '+(op.unidade||''))){ state.op=null; state.view='board'; toast('Só os motoristas (Transportes) fazem transportes.','err'); return; }

  if(aberto){ state.curJob=aberto.id; state._trErros=[]; state.view='job'; render(); loadStockMap().then(()=>{ if(state.view==='job') render(); }); return; }
  const o=trOperacao(); if(!o){ state.view='board'; toast('Falta a operação de transporte no catálogo','err'); return; }
  const agora=nowTs(); const d=new Date(agora);

  const relId='ENT-'+dstr(agora).replace(/-/g,'')+'-'+two(d.getHours())+two(d.getMinutes())+'-'+trNorm(curto(op.nome)).replace(/[^a-z]/g,'').slice(0,10);

  const j={ id:'J'+agora, artigo:(o.artigos&&o.artigos[0])||'Transporte', programa:o.programa||'Transporte', operacao:o.operacao, unidade:o.unidade,
    modo:'Stock', series:['TRANSP-'+String(agora).slice(-6)], plano:'', dia:dstr(agora), status:'open', workers:[worker],
    transp:{ fase:'carga', destino:'ANN', relId, caixas:[], guia:{numero:'',codigoAT:''}, viatura:viat, ts:{inicio:agora}, gps:{},
      checklist:{}, observacoes:'', recetor:{nome:'',email:'',recusou:false,motivo:''}, assinado:{ann:false,mot:false} } };
  state.jobs.push(j); save(); pushTrabAberto(j,'aberto');
